<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <title>Honey Space – Gallery</title>

  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Shadows Into Light', cursive;
      background: black;
      color: black;
    }

    /* ===============================
       BACKGROUND
    =============================== */
    #galleryBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }

    /* ===============================
       CONTENT
    =============================== */
    .content {
      position: relative;
      z-index: 1;
      padding: 50px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* ===============================
       UNIVERSAL HOME LOGO
    =============================== */
    #homeLogo {
      position: fixed;
      top: 20px;
      left: 420px;   /* matches your other pages */
      width: 600px;  /* large logo */
      z-index: 9999;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeLogo:hover {
      transform: scale(1.2);
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <img src="../Images/gallery-background.png?v=2" id="galleryBG" alt="Gallery Background">

  <!-- UNIVERSAL LOGO -->
  <a href="../index.html">
    <img src="../Images/homebutton-logo.png?v=2" id="homeLogo" alt="Home">
  </a>

</body>
</html>
