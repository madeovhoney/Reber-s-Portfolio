<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <title>Honey Space – Gallery</title>

  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      font-family: 'Shadows Into Light', cursive;
      background: black;
      color: white;
      overflow-x: hidden;
    }

    /* ===============================
       GALLERY CONTAINER
    =============================== */
    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 80px;
      padding: 120px 20px 60px;
    }

    /* ===============================
       GALLERY IMAGES
    =============================== */
    .gallery img {
      width: 90%;
      max-width: 900px;
      border-radius: 20px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
    }

    /* ===============================
       UNIVERSAL HOME LOGO
    =============================== */
    #homeLogo {
      position: fixed;
      top: 10px;
      left: 250px;
      width: 400px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeLogo:hover {
      transform: scale(1.2);
    }

    /* ===============================
       OPTIONAL SCROLL SMOOTHING
    =============================== */
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body>

  <!-- UNIVERSAL LOGO -->
  <a href="../index.html">
    <img src="../Images/homebutton-logowhite.png?v=2" id="homeLogo" alt="Home">
  </a>

  <!-- GALLERY -->
  <div class="gallery">
    <img src="../Images/gallery_IMG1.png" alt="Gallery Image 1">
    <img src="../Images/gallery_IMG2.png" alt="Gallery Image 2">
    <img src="../Images/gallery_IMG3.png" alt="Gallery Image 3">
    <img src="../Images/gallery_IMG4.png" alt="Gallery Image 4">
  </div>

</body>
</html>
