<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <title>Honey Space – Gallery</title>

  <style>
    body {
      margin: 0;
      font-family: 'Shadows Into Light', cursive;
      background: black;
      color: white;
      overflow-x: hidden;
    }

    /* FULL BACKGROUND FIX */
    #galleryBG {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    #homeLogo {
      position: fixed;
      top: 10px;
      left: 250px;
      width: 400px;
      z-index: 1000;
      cursor: pointer;
    }

    /* SLIDESHOW */
    .slideshow {
      position: absolute;
      top: 200px;
      left: 200px;

      width: 600px;
      height: 450px;

      overflow: hidden;
      background: black;
    }

    .slide-track {
      display: flex;
      width: calc(600px * 8);
      animation: scroll 25s linear infinite;
    }

    .slide-track img {
      width: 600px;
      height: 100%;
      object-fit: contain;
    }

    /* FALLBACK TEXT */
    .img-fallback {
      width: 600px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      color: white;
      text-align: center;
      padding: 10px;
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-2400px); }
    }
  </style>
</head>

<body>

  <img src="../Images/gallery-background.png?v=2" id="galleryBG">

  <a href="../index.html">
    <img src="../Images/homebutton-logowhite.png?v=2" id="homeLogo">
  </a>

  <div class="slideshow">
    <div class="slide-track">

      <img src="../Images/gallery_IMG 1.jpg" alt="Gallery image 1"
           onerror="this.outerHTML='<div class=&quot;img-fallback&quot;>Gallery image 1</div>';">
      <img src="../Images/gallery_IMG 2.jpg" alt="Gallery image 2"
           onerror="this.outerHTML='<div class=&quot;img-fallback&quot;>Gallery image 2</div>';">
      <img src="../Images/gallery_IMG 3.jpg" alt="Gallery image 3"
           onerror="this.outerHTML='<div class=&quot;img-fallback&quot;>Gallery image 3</div>';">
      <img src="../Images/gallery_IMG 4.jpg" alt="Gallery image 4"
           onerror="this.outerHTML='<div class=&quot;img-fallback&quot;>Gallery image 4</div>';">

      <!-- duplicate -->
      <img src="../Images/gallery_IMG 1.jpg" alt=""
           onerror="this.outerHTML='<div class=&quot;img-fallback&quot;>Gallery image 1</div>';">
      <img src="../Images/gallery_IMG 2.jpg" alt=""
           onerror="this.outerHTML='<div class=&quot;img-fallback&quot;>Gallery image 2</div>';">
      <img src="../Images/gallery_IMG 3.jpg" alt=""
           onerror="this.outerHTML='<div class=&quot;img-fallback&quot;>Gallery image 3</div>';">
      <img src="../Images/gallery_IMG 4.jpg" alt=""
           onerror="this.outerHTML='<div class=&quot;img-fallback&quot;>Gallery image 4</div>';">

    </div>
  </div>

</body>
</html>
