<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <title>Honey Space – Gallery</title>

  <style>
    /* ===============================
       GLOBAL
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Shadows Into Light', cursive;
      background: black;
      color: white;
    }

    /* ===============================
       BACKGROUND (MATCHES BLOG PAGE)
    =============================== */
    #galleryBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }

    /* ===============================
       HOME LOGO
    =============================== */
    #homeLogo {
      position: fixed;
      top: 10px;
      left: 250px;
      width: 400px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeLogo:hover {
      transform: scale(1.2);
    }

    /* ===============================
       SLIDESHOW (POSITION + SIZE CONTROL)
    =============================== */
    .slideshow {
      position: absolute;
      top: 124px;   /* adjust vertical position */
      left: 100px;  /* adjust horizontal position */

      width: 600px;
      height: 550px;  /* 🔥 adjust height here */

      overflow: hidden;
      background: black;
      border-radius: 10px;
      padding: 20px; /* gives breathing room */
    }

    /* ===============================
       TRACK
    =============================== */
    .slide-track {
      display: flex;
      gap: 40px; /* spacing between slides */
      animation: scroll 30s linear infinite;
    }

    /* ===============================
       INDIVIDUAL SLIDE
    =============================== */
    .slide {
      width: 600px;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===============================
       IMAGE (NO EDGE-TO-EDGE)
    =============================== */
    .slide img {
      max-width: 80%;
      max-height: 90%;
      object-fit: contain;
    }

    /* ===============================
       ANIMATION
    =============================== */
    @keyframes scroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-2800px); /* adjusted for spacing */
      }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <img src="../Images/gallery-background.png" id="galleryBG" alt="Gallery Background">

  <!-- HOME BUTTON -->
  <a href="../index.html">
    <img src="../Images/homebutton-logowhite.png" id="homeLogo" alt="Home">
  </a>

  <!-- SLIDESHOW -->
  <div class="slideshow">
    <div class="slide-track">

      <div class="slide">
        <img src="../Images/gallery_IMG 1.jpg" alt="Gallery image 1">
      </div>

      <div class="slide">
        <img src="../Images/gallery_IMG 2.jpg" alt="Gallery image 2">
      </div>

      <div class="slide">
        <img src="../Images/gallery_IMG 3.jpg" alt="Gallery image 3">
      </div>

      <div class="slide">
        <img src="../Images/gallery_IMG 4.jpg" alt="Gallery image 4">
      </div>

      <!-- DUPLICATES FOR LOOP -->
      <div class="slide">
        <img src="../Images/gallery_IMG1.jpg" alt="">
      </div>

      <div class="slide">
        <img src="../Images/gallery_IMG2.jpg" alt="">
      </div>

      <div class="slide">
        <img src="../Images/gallery_IMG3.jpg" alt="">
      </div>

      <div class="slide">
        <img src="../Images/gallery_IMG4.jpg" alt="">
      </div>

    </div>
  </div>

</body>
</html>
