<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <title>Honey Space – Gallery</title>

  <style>
    /* ===============================
       GLOBAL
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Shadows Into Light', cursive;
      background: black;
      color: white;
    }

    /* ===============================
       BACKGROUND
    =============================== */
    #galleryBG {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: -1;
    }

    /* ===============================
       HOME LOGO
    =============================== */
    #homeLogo {
      position: fixed;
      top: 10px;
      left: 250px;
      width: 400px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeLogo:hover {
      transform: scale(1.2);
    }

    /* ===============================
       TITLE
    =============================== */
    h1 {
      text-align: center;
      margin-top: 120px;
      font-size: 3rem;
    }

    /* ===============================
       SLIDESHOW (POSITION CONTROL)
    =============================== */
    .slideshow {
      position: absolute;   /* <-- CHANGE THIS if needed */
      top: 400px;           /* move up/down */
      left: 200px;          /* move left/right */

      width: 600px;
      height: 300px;
      overflow: hidden;
      border-radius: 10px;
    }

    /* ===============================
       TRACK (ANIMATION)
    =============================== */
    .slide-track {
      display: flex;
      width: calc(600px * 8);
      animation: scroll 20s linear infinite;
    }

    .slide-track img {
      width: 600px;
      height: 300px;
      object-fit: cover;
    }

    /* ===============================
       SCROLL ANIMATION
    =============================== */
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-2400px); }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <img src="../Images/gallery-background.png?v=2" id="galleryBG" alt="Gallery Background">

  <!-- HOME BUTTON -->
  <a href="../index.html">
    <img src="../Images/homebutton-logowhite.png?v=2" id="homeLogo" alt="Home">
  </a>

  <!-- TITLE -->
  <h1>Gallery</h1>

  <!-- SLIDESHOW -->
  <div class="slideshow">
    <div class="slide-track">
      <img src="../Images/gallery_IMG1.jpg" alt="">
      <img src="../Images/gallery_IMG2.jpg" alt="">
      <img src="../Images/gallery_IMG3.jpg" alt="">
      <img src="../Images/gallery_IMG4.jpg" alt="">

      <!-- duplicate for smooth loop -->
      <img src="../Images/gallery_IMG1.jpg" alt="">
      <img src="../Images/gallery_IMG2.jpg" alt="">
      <img src="../Images/gallery_IMG3.jpg" alt="">
      <img src="../Images/gallery_IMG4.jpg" alt="">
    </div>
  </div>

</body>
</html>
