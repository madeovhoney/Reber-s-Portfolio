<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <title>Honey Space – Gallery</title>

  <style>
    /* ===============================
       GLOBAL
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Shadows Into Light', cursive;
      background: black;
      color: white;
    }

    /* ===============================
       BACKGROUND (MATCHES BLOG PAGE)
    =============================== */
    #galleryBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }

    /* ===============================
       HOME LOGO
    =============================== */
    #homeLogo {
      position: fixed;
      top: 10px;
      left: 250px;
      width: 400px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeLogo:hover {
      transform: scale(1.2);
    }

    /* ===============================
       SLIDESHOW
    =============================== */
    .slideshow {
      position: absolute;
      top: 125px;   /* adjust vertically */
      left: 350px;  /* adjust horizontally */

      width: 600px;
      height: 600px;   /height*/

      overflow: hidden;
      background: black;
      border-radius: 10px;
    }

    .slide-track {
      display: flex;
      width: calc(600px * 8);
      animation: scroll 25s linear infinite;
    }

    .slide-track img {
      width: 50%;
      height: 90%;
      object-fit: contain;
      margin: 0 auto;    /* center it */
      display: block;/* shows full image */
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-2400px); }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <img src="../Images/gallery-background.png" id="galleryBG" alt="Gallery Background">

  <!-- HOME BUTTON -->
  <a href="../index.html">
    <img src="../Images/homebutton-logowhite.png" id="homeLogo" alt="Home">
  </a>

  <!-- SLIDESHOW -->
  <div class="slideshow">
    <div class="slide-track">

      <img src="../Images/gallery_IMG 1.jpg" alt="Gallery image 1"
           onerror="this.outerHTML='<div class=&quot;img-fallback&quot;>Gallery image 1</div>';">
      <img src="../Images/gallery_IMG 2.jpg" alt="Gallery image 2"
           onerror="this.outerHTML='<div class=&quot;img-fallback&quot;>Gallery image 2</div>';">
      <img src="../Images/gallery_IMG 3.jpg" alt="Gallery image 3"
           onerror="this.outerHTML='<div class=&quot;img-fallback&quot;>Gallery image 3</div>';">
      <img src="../Images/gallery_IMG 4.jpg" alt="Gallery image 4"
           onerror="this.outerHTML='<div class=&quot;img-fallback&quot;>Gallery image 4</div>';">

      <!-- duplicate for smooth loop -->
      <img src="../Images/gallery_IMG 1.jpg" alt="">
      <img src="../Images/gallery_IMG 2.jpg" alt="">
      <img src="../Images/gallery_IMG 3.jpg" alt="">
      <img src="../Images/gallery_IMG 4.jpg" alt="">

    </div>
  </div>

</body>
</html>
