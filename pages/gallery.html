<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <title>Honey Space – Gallery</title>

  <style>

    /* ===============================
       GLOBAL
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Shadows Into Light', cursive;
      background: black;
      color: white;
    }

    /* ===============================
       BACKGROUND
    =============================== */
    #galleryBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }

    /* ===============================
       HOME LOGO
    =============================== */
    #homeLogo {
      position: fixed;

      top: 10px;
      left: 250px;

      width: 400px;

      z-index: 1000;
      cursor: pointer;

      transition: transform 0.2s ease;
    }

    #homeLogo:hover {
      transform: scale(1.2);
    }

    /* ===============================
       SLIDESHOW
    =============================== */
    .slideshow {
      position: absolute;

      top: 122px;
      left: 323px;

      width: 600px;
      height: 800px;

      overflow: hidden;

      background: black;
      border-radius: 10px;
    }

    /* ===============================
       TRACK
    =============================== */
    .slide-track {
      display: flex;
      animation: scroll 30s linear infinite;
    }

    /* ===============================
       SLIDE
    =============================== */
    .slide {
      min-width: 600px;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===============================
       IMAGE
    =============================== */
    .slide img {
      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    /* ===============================
       ANIMATION
    =============================== */
    @keyframes scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-2400px); }
    }

    /* ===============================
       MOBILE / TABLET
    =============================== */
    @media (max-width: 768px) {

      /* ---------- MOBILE BODY ---------- */
      body {
        overflow-x: hidden;
      }

      /* ---------- MOBILE BACKGROUND ---------- */
      #galleryBG {
        width: 100%;
        height: 100vh;

        object-fit: cover;
      }

      /*
        object-fit: cover   = fills screen
        object-fit: contain = shows more background
      */

      /* ---------- MOBILE HOME LOGO ---------- */
      #homeLogo {
        position: fixed;

        top: 10px;
        left: 25%;

        width: 200px;

        transform: translateX(-50%);
      }

      /*
        top: 0px   = higher
        top: 50px  = lower

        width: 200px = smaller
        width: 350px = larger
      */

      /* ---------- MOBILE SLIDESHOW ---------- */
      .slideshow {
        position: relative;

        top: -600;
        left: auto;

        width: 90%;
        max-width: 350px;

        height: 500px;

        margin: -600px auto 0 auto;

        transform: translateX(0px);
      }

      /*
        margin-top values:
        -800px = higher
        -300px = lower

        translateX(-50px) = move left
        translateX(50px)  = move right
      */

      /* ---------- MOBILE SLIDE ---------- */
      .slide {
        min-width: 350px;
      }

      /*
        min-width: 250px = smaller slideshow
        min-width: 450px = larger slideshow
      */

      /* ---------- MOBILE IMAGE ---------- */
      .slide img {
        width: 100%;
        height: 100%;

        object-fit: contain;
      }

      /*
        object-fit: contain = full image visible
        object-fit: cover   = fills frame / crops image
      */

      /* ---------- MOBILE ANIMATION ---------- */
      @keyframes scroll {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-1400px); }
      }

      /*
        Larger negative value = longer scrolling distance
        Smaller negative value = shorter scrolling distance
      */
    }

  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <img src="../Images/gallery-background.png" id="galleryBG" alt="Gallery Background">

  <!-- HOME BUTTON -->
  <a href="../index.html">
    <img src="../Images/homebutton-logowhite.png" id="homeLogo" alt="Home">
  </a>

  <!-- SLIDESHOW -->
  <div class="slideshow">

    <div class="slide-track">

      <!-- IMAGE 1 -->
      <div class="slide">
        <img src="../Images/gallery_IMG%201.jpg" alt="Gallery image 1">
      </div>

      <!-- IMAGE 2 -->
      <div class="slide">
        <img src="../Images/gallery_IMG%202.jpg" alt="Gallery image 2">
      </div>

      <!-- IMAGE 3 -->
      <div class="slide">
        <img src="../Images/gallery_IMG%203.jpg" alt="Gallery image 3">
      </div>

      <!-- IMAGE 4 -->
      <div class="slide">
        <img src="../Images/gallery_IMG%204.jpg" alt="Gallery image 4">
      </div>

      <!-- DUPLICATES FOR LOOP -->
      <div class="slide">
        <img src="../Images/gallery_IMG%201.jpg" alt="">
      </div>

      <div class="slide">
        <img src="../Images/gallery_IMG%202.jpg" alt="">
      </div>

      <div class="slide">
        <img src="../Images/gallery_IMG%203.jpg" alt="">
      </div>

      <div class="slide">
        <img src="../Images/gallery_IMG%204.jpg" alt="">
      </div>

    </div>

  </div>

</body>
</html>
