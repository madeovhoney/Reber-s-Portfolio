<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <title>Honey Space – Gallery</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Shadows Into Light', cursive;
      background: black;
      color: white;
    }

    #galleryBG {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: -1;
    }

    #homeLogo {
      position: fixed;
      top: 10px;
      left: 250px;
      width: 400px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeLogo:hover {
      transform: scale(1.2);
    }

    /* SLIDESHOW */
    .slideshow {
      position: absolute;
      top: 200px;
      left: 200px;

      width: 600px;
      height: 450px; /* adjust height here */

      overflow: hidden;
      border-radius: 10px;
      background: black;
    }

    .slide-track {
      display: flex;
      width: calc(600px * 8);
      animation: scroll 25s linear infinite;
    }

    /* EACH SLIDE */
    .slide {
      width: 600px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .slide img {
      max-width: 100%;
      max-height: 85%;
      object-fit: contain;
    }

    /* CAPTION */
    .caption {
      margin-top: 8px;
      font-size: 1rem;
      text-align: center;
      opacity: 0.85;
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-2400px); }
    }
  </style>
</head>

<body>

  <img src="../Images/gallery-background.png?v=2" id="galleryBG" alt="Gallery Background">

  <a href="../index.html">
    <img src="../Images/homebutton-logowhite.png?v=2" id="homeLogo" alt="Home">
  </a>

  <div class="slideshow">
    <div class="slide-track">

      <!-- SLIDE 1 -->
      <div class="slide">
        <img src="../Images/gallery_IMG 1.jpg" alt="Photo 1">
        <div class="caption">Photo Title 1</div>
      </div>

      <!-- SLIDE 2 -->
      <div class="slide">
        <img src="../Images/gallery_IMG 2.jpg" alt="Photo 2">
        <div class="caption">Photo Title 2</div>
      </div>

      <!-- SLIDE 3 -->
      <div class="slide">
        <img src="../Images/gallery_IMG 3.jpg" alt="Photo 3">
        <div class="caption">Photo Title 3</div>
      </div>

      <!-- SLIDE 4 -->
      <div class="slide">
        <img src="../Images/gallery_IMG 4.jpg" alt="Photo 4">
        <div class="caption">Photo Title 4</div>
      </div>

      <!-- DUPLICATES FOR LOOP -->
      <div class="slide">
        <img src="../Images/gallery_IMG 1.jpg" alt="">
        <div class="caption">Photo Title 1</div>
      </div>

      <div class="slide">
        <img src="../Images/gallery_IMG 2.jpg" alt="">
        <div class="caption">Photo Title 2</div>
      </div>

      <div class="slide">
        <img src="../Images/gallery_IMG 3.jpg" alt="">
        <div class="caption">Photo Title 3</div>
      </div>

      <div class="slide">
        <img src="../Images/gallery_IMG 4.jpg" alt="">
        <div class="caption">Photo Title 4</div>
      </div>

    </div>
  </div>

</body>
</html>
