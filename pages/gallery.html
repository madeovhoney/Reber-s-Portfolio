<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honey Space – Gallery</title>
  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: black; /* black background behind image */
      color: white;
    }

    /* ===============================
       SCROLLABLE FULL-BACKGROUND IMAGE
    =============================== */
    #galleryBG {
      width: 100%;
      height: auto;           /* maintains aspect ratio */
      max-width: 1920px;      /* optional max width */
      display: block;
    }

    /* ===============================
       PAGE CONTENT
    =============================== */
    .content {
      position: relative;
      z-index: 1;
      padding: 50px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Scrollable Gallery Background -->
  <img src="../Images/gallery-background.png" id="galleryBG" alt="Gallery Background">

  <!-- Page Content -->
  <div class="content">
    <h1>Gallery</h1>
    <p>Explore the Honey Space gallery. The background scrolls naturally, just like the homepage and other pages.</p>
  </div>

</body>
</html>
