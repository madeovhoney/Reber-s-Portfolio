<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honey Space – About</title>
  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: black; /* black behind transparent image */
      color: black;
    }

    /* ===============================
       SCROLLABLE FULL-BACKGROUND IMAGE
    =============================== */
    #aboutBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }

    /* ===============================
       PAGE CONTENT
    =============================== */
    .content {
      position: absolute; /* allows free placement */
      z-index: 1;
      
      /* ========== ADJUST THIS AREA TO MOVE "ABOUT ME" ========== */
      top: 200px;    /* distance from top of page */
      left: 650px;    /* distance from left of page */
      max-width: 1200px;
      padding: 20px;
      /* optional centering text */
      /* text-align: center; */
      /* ======================================================== */
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* ===============================
       PURPLE HOME BUTTON
    =============================== */
    #homeButton {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 50px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeButton:hover {
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <!-- Scrollable About Background -->
  <img src="../Images/about-background.png" id="aboutBG" alt="About Background">

  <!-- Page Content -->
  <div class="content">
    <p>Welcome to Honey Space. This page is a work in progress, </p>
    <p>so please have a look around although you might not find much information!</p>
    <p>My name is Reber Kai Kellam and I'll introduce myself soon enough.</p>
  </div>

  <!-- Purple Home Button linking to homepage overlay -->
  <a href="../index.html?overlay=1">
    <img src="../Images/purplebutton.png" id="homeButton" alt="Go Home">
  </a>

</body>
</html>
