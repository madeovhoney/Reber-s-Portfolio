<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honey Space – About</title>
  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: black; /* black behind transparent image */
      color: white;
    }

    /* ===============================
       SCROLLABLE FULL-BACKGROUND IMAGE
    =============================== */
    #aboutBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }

    /* ===============================
       PAGE CONTENT
    =============================== */
    .content {
      position: relative;
      z-index: 1;
      padding: 50px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* ===============================
       PURPLE HOME BUTTON
    =============================== */
    #homeButton {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 50px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeButton:hover {
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <!-- Scrollable About Background -->
  <img src="../Images/about-background.png" id="aboutBG" alt="About Background">

  <!-- Page Content -->
  <div class="content">
    <h1>About</h1>
    <p>Welcome to Honey Space. This page uses a transparent background image, but the black page background ensures it displays correctly.</p>
    <p>Here you can include more information about the project, yourself, or any other content you’d like visitors to see.</p>
  </div>

  <!-- Purple Home Button linking to homepage overlay -->
  <a href="../index.html?overlay=1">
    <img src="../Images/purplebutton.png" id="homeButton" alt="Go Home">
  </a>

</body>
</html>
