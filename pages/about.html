<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <title>Honey Space – About</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Shadows Into Light', cursive;
      background: black;
      color: black; /* FIXED visibility */
    }

    /* BACKGROUND */
    #aboutBG {
      position: fixed;      /* keeps it behind everything */
      top: 0;
      left: 0;
      width: 100%;
      z-index: -1;          /* prevents blocking content */
    }

    /* CONTENT */
    .content {
      position: absolute;
      z-index: 2;

      top: 200px;
      left: 475px;

      max-width: 1200px;
      padding: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* PHOTO */
    #myPhoto {
      position: absolute;
      top: 211px;
      left: 175px;
      width: 250px;
      z-index: 2;
    }

    /* HOME LOGO */
    #homeLogo {
      position: fixed;
      top: 20px;
      left: 420px;
      width: 600px;
      z-index: 9999;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeLogo:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <img src="../Images/about-background.png?v=2" id="aboutBG" alt="About Background">

  <!-- HOME BUTTON (FIXED LINK) -->
  <a href="../index.html">
    <img src="../Images/Logo-aboutpage.png?v=2" id="homeLogo" alt="Home">
  </a>

  <!-- PHOTO -->
  <img src="../Images/Me-2026.jpg" id="myPhoto" alt="Photo of me">

  <!-- CONTENT -->
  <div class="content">
    <p>Welcome to Honey Space! This page is a work in progress.</p>
    <p>Please have a look around, although you might not find much information.</p>
    <p>My name is Reber Kai Kellam and I'll introduce myself soon enough.</p>
  </div>

</body>
</html>
