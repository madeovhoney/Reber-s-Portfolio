<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <title>Honey Space – About</title>

  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Shadows Into Light', cursive;
      background: black;
      color: white; /* FIXED: text is now visible */
    }

    /* ===============================
       BACKGROUND IMAGE
    =============================== */
    #aboutBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }

    /* ===============================
       PAGE CONTENT
    =============================== */
    .content {
      position: absolute;
      z-index: 1;

      top: 200px;
      left: 475px;

      max-width: 1200px;
      padding: 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* ===============================
       LOGO HOME BUTTON
    =============================== */
    #homeLogo {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 60px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeLogo:hover {
      transform: scale(1.2);
    }
  </style>
</head>

<body>

  <!-- Background -->
  <img src="../Images/about-background.png" id="aboutBG" alt="About Background">

  <!-- LOGO = HOME BUTTON -->
  <a href="../index.html?overlay=1">
    <img src="../Images/Logo-aboutpage.png" id="homeLogo" alt="Home Button Logo">
  </a>

  <!-- Content -->
  <div class="content">
    <p>Welcome to Honey Space! This page is a work in progress.</p>
    <p>Please have a look around, although you might not find much information.</p>
    <p>My name is Reber Kai Kellam and I'll introduce myself soon enough.</p>
  </div>

</body>
</html>
