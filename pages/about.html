<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <title>Honey Space – About</title>

  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Shadows Into Light', cursive;
      background: black;
      color: black;
    }

    /* ===============================
       BACKGROUND IMAGE
    =============================== */
    #aboutBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }

    /* ===============================
       PAGE CONTENT
    =============================== */
    .content {
      position: absolute;
      z-index: 1;

      top: 200px;
      left: 475px;

      max-width: 1200px;
      padding: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* ===============================
       📸 YOUR PHOTO (FULL CONTROL AREA)
    =============================== */
    #myPhoto {
      position: absolute;

      top: 225px;   /* move up/down */
      left: 175px;  /* move left/right */

      width: 250px; /* resize */

      z-index: 2;

      /* Optional styling */
      /* border-radius: 20px; */
      /* box-shadow: 0 0 20px rgba(0,0,0,0.5); */
    }

    /* ===============================
       LOGO HOME BUTTON
    =============================== */
    #homeLogo {
      position: fixed;
      top: 20px;
      left: 420px;
      width: 600px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeLogo:hover {
      transform: scale(1.2);
    }
  </style>
</head>

<body>

  <!-- Background (cache-busted) -->
  <img src="../Images/about-background.png?v=2" id="aboutBG" alt="About Background">

  <!-- Logo -->
  <a href="../index.html?overlay=1">
    <img src="../Images/Logo-aboutpage.png" id="homeLogo" alt="Home Button Logo">
  </a>

  <!-- 📸 My PHOTO (FIXED) -->
  <img src="../Images/Me-2026.jpg" id="myPhoto" alt="Photo of me">

  <!-- Content -->
  <div class="content">
    <p>Welcome to Honey Space! This page is a work in progress.</p>
    <p>Please have a look around, although you might not find much information.</p>
    <p>My name is Reber Kai Kellam and I'll introduce myself soon enough.</p>
  </div>

</body>
</html>
