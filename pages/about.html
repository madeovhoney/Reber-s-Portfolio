<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honey Space – About</title>
  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: black; /* black background behind transparent image */
      color: white;
    }

    /* ===============================
       SCROLLABLE FULL-BACKGROUND IMAGE
    =============================== */
    #aboutBG {
      width: 100%;
      height: auto;          /* keep image proportion */
      max-width: 1920px;     /* optional max width */
      display: block;
    }

    /* ===============================
       PAGE CONTENT
    =============================== */
    .content {
      position: relative;
      z-index: 1;
      padding: 50px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Scrollable About Background -->
  <img src="../Images/about-background.png" id="aboutBG" alt="About Background">

  <!-- Page Content -->
  <div class="content">
    <h1>About</h1>
    <p>Welcome to Honey Space. This page uses a transparent background image, but the black page background ensures it displays correctly.</p>
  </div>

</body>
</html>
