<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Makes site responsive on mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Honey Space – Contact</title>

  <style>

    /* ===============================
       1. GLOBAL PAGE STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: black;
      color: black;
    }


    /* ===============================
       2. BACKGROUND IMAGE
    =============================== */
    #contactBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }


    /* ===============================
       3. CUPID IMAGES
    =============================== */

    #cupidBlueUFO {
      position: absolute;
      top: 190px;
      left: 50px;
      width: 1175px;
      z-index: 2;
    }

    #cupidRedYellow {
      position: absolute;
      top: 685px;
      left: 50px;
      width: 1150px;
      z-index: 2;

      animation: dreamyFloat 6s ease-in-out infinite;
    }


    /* ===============================
       4. FLOAT ANIMATION
    =============================== */
    @keyframes dreamyFloat {
      0%   { transform: translate(0px, 0px) rotate(0deg); }
      25%  { transform: translate(5px, -10px) rotate(1deg); }
      50%  { transform: translate(0px, -20px) rotate(0deg); }
      75%  { transform: translate(-5px, -10px) rotate(-1deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }


    /* ===============================
       5. CONTACT FORM CONTAINER
       👉 MAIN POSITION + SIZE CONTROL
    =============================== */
    #contactFormContainer {
      position: absolute;

      top: 450px;   /* 🔧 MOVE FORM UP/DOWN */
      left: 500px;  /* 🔧 MOVE FORM LEFT/RIGHT */

      width: 320px; /* 🔧 CHANGE FORM WIDTH */

      z-index: 3;
      color: white;
    }


    /* ===============================
       6. FORM BOX STYLE
       👉 VISUAL STYLE CONTROL
    =============================== */
    #contactForm {
      background: rgba(0, 0, 0, 0.6); /* прозрачный dark panel */
      padding: 20px;
      border: 1px solid white;
      backdrop-filter: blur(5px); /* soft glass effect */
    }


    /* ===============================
       7. INPUT FIELDS
       =============================== */
    #contactForm input,
    #contactForm textarea {
      width: 100%;

      padding: 10px;
      margin-top: 6px;
      margin-bottom: 15px;

      background: rgba(255,255,255,0.1);
      border: 1px solid white;
      color: white;

      font-size: 14px;
    }

    #contactForm textarea {
      resize: none; /* prevents drag resize */
    }


    /* ===============================
       8. BUTTON STYLE
    =============================== */
    #contactForm button {
      width: 100%;
      padding: 12px;

      background: purple;
      border: none;
      color: white;

      cursor: pointer;
      transition: 0.2s;
    }

    #contactForm button:hover {
      background: violet;
      transform: scale(1.05);
    }


    /* ===============================
       9. SUCCESS MESSAGE
    =============================== */
    #formSuccess {
      display: none;
      margin-top: 10px;
      color: #ffccff;
      font-size: 14px;
    }


    /* ===============================
       10. HOME BUTTON
    =============================== */
    #homeButton {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 50px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeButton:hover {
      transform: scale(1.2);
    }

  </style>
</head>


<body>

  <!-- BACKGROUND -->
  <img src="../Images/contactbackground.png" id="contactBG">


  <!-- CUPIDS -->
  <img src="../Images/bluecupidufocontact.png" id="cupidBlueUFO">
  <img src="../Images/redandyellowcupids.png" id="cupidRedYellow">


  <!-- ===============================
       11. CONTACT FORM (FORM SPREE)
    =============================== -->
  <div id="contactFormContainer">

    <form id="contactForm"
          action="https://formspree.io/f/mlgoqenk"
          method="POST">

      <!-- NAME -->
      <label>Your Name:</label>
      <input type="text" name="name" required>

      <!-- EMAIL -->
      <label>Your Email:</label>
      <input type="email" name="email" required>

      <!-- MESSAGE -->
      <label>So, What's Up?</label>
      <textarea name="message" rows="5" required></textarea>

      <!-- SUBMIT -->
      <button type="submit">Send It!</button>

      <!-- SUCCESS TEXT -->
      <div id="formSuccess">✨ Message sent successfully!</div>

    </form>

  </div>


  <!-- HOME BUTTON -->
  <a href="../index.html?overlay=1">
    <img src="../Images/purplebutton.png" id="homeButton">
  </a>

</body>
</html>
