<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">
  <title>Honey Space – Contact</title>
  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
  margin: 0;
  padding: 0;
  font-family: 'Shadows Into Light', cursive;
  background: black;
  color: black;
}
  <style>

    /* ===============================
       1. GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: black;
      color: black;
    }


    /* ===============================
       2. BACKGROUND IMAGE
    =============================== */
    #contactBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }


    /* ===============================
       3. CUPID IMAGES
    =============================== */

    /* BLUE CUPID (ENTER ANIMATION) */
    #cupidBlueUFO {
      position: absolute;
      top: 190px;
      left: 50px;
      width: 1175px;
      z-index: 2;

      transform-origin: center;
      animation: cupidGrowIn 2.5s ease-out forwards;
    }

    /* RED + YELLOW CUPID (FLOATING) */
    #cupidRedYellow {
      position: absolute;
      top: 685px;
      left: 50px;
      width: 1150px;
      z-index: 2;

      animation: dreamyFloat 6s ease-in-out infinite;
    }


    /* ===============================
       4. ANIMATIONS
    =============================== */

    @keyframes cupidGrowIn {
      0% {
        transform: scale(0.2);
        opacity: 0;
      }
      80% {
        transform: scale(1.05);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes dreamyFloat {
      0%   { transform: translate(0px, 0px) rotate(0deg); }
      25%  { transform: translate(5px, -10px) rotate(1deg); }
      50%  { transform: translate(0px, -20px) rotate(0deg); }
      75%  { transform: translate(-5px, -10px) rotate(-1deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }


    /* ===============================
       5. CONTACT FORM POSITION
    =============================== */
    #contactFormContainer {
      position: absolute;

      top: 650px;
      left: 475px;

      width: 350px;
      z-index: 3;

      color: white;
    }


    /* ===============================
       6. FORM PANEL STYLE
    =============================== */
    #contactForm {
      background: rgba(0,0,0,0.6);
      border: 1px solid white;
      padding: 32px;
      backdrop-filter: blur(6px);
    }


    /* ===============================
       7. LABEL SPACING FIX
    =============================== */
    #contactForm label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      color: white;
      font-size: 13px;
    }


    /* ===============================
       8. INPUT FIELD SPACING FIX
    =============================== */
    #contactForm input,
    #contactForm textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;

      background: rgba(255,255,255,0.1);
      border: 1px solid white;
      color: white;

      box-sizing: border-box;
    }

    #contactForm textarea {
      resize: none;
    }


    /* ===============================
       9. SUBMIT BUTTON (PURPLE THEME)
       COLOR: #9023f4
    =============================== */
    #contactForm button {
      width: 100%;
      padding: 12px;

      background: #9023f4;
      border: none;
      color: white;

      font-size: 14px;
      letter-spacing: 0.5px;

      cursor: pointer;

      border-radius: 6px;

      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #contactForm button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 18px rgba(144, 35, 244, 0.7);
    }


    /* ===============================
       10. SUCCESS MESSAGE (OPTIONAL)
    =============================== */
    #formSuccess {
      display: none;
      margin-top: 10px;
      color: #9023f4;
      font-size: 13px;
    }


    /* ===============================
       11. HOME BUTTON
    =============================== */
    #homeButton {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 50px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeButton:hover {
      transform: scale(1.2);
    }

  </style>
</head>


<body>

  <!-- BACKGROUND -->
  <img src="../Images/contactbackground.png" id="contactBG">


  <!-- CUPIDS -->
  <img src="../Images/bluecupidufocontact.png" id="cupidBlueUFO">
  <img src="../Images/redandyellowcupids.png" id="cupidRedYellow">


  <!-- CONTACT FORM -->
  <div id="contactFormContainer">

    <form id="contactForm"
          action="https://formspree.io/f/mlgoqenk"
          method="POST">

      <label>Name</label>
      <input type="text" name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Message</label>
      <textarea name="message" rows="5" required></textarea>

      <button type="submit">Send Message</button>

      <div id="formSuccess">✨ Message sent successfully!</div>

    </form>

  </div>


  <!-- HOME BUTTON -->
  <a href="../index.html?overlay=1">
    <img src="../Images/purplebuttonon.png" id="homeButton">
  </a>

</body>
</html>
