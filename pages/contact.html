<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honey Space – Contact</title>

  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: black;
      color: black;
    }

    /* ===============================
       BACKGROUND IMAGE
    =============================== */
    #contactBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }

    /* ===============================
       CUPID IMAGES (FOR ANIMATION LATER)
       👉 Adjust position + size here
    =============================== */

    /* BLUE UFO CUPID */
    #cupidBlueUFO {
      position: absolute;
      top: 175px;     /* move up/down */
      left: 50px;    /* move left/right */
      width: 1150px;   /* resize */
      z-index: 2;
    }

    /* RED & YELLOW CUPIDS */
    #cupidRedYellow {
      position: absolute;
      top: 750px;     /* move up/down */
      left: 100px;    /* move left/right */
      width: 1150px;   /* resize */
      z-index: 2;
    }

    /* ===============================
       PAGE CONTENT (if needed later)
    =============================== */
    .content {
      position: absolute;
      z-index: 1;
      top: 200px;
      left: 700px;
      max-width: 1200px;
      padding: 20px;
    }

    /* ===============================
       HOME BUTTON
    =============================== */
    #homeButton {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 50px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeButton:hover {
      transform: scale(1.2);
    }
  </style>
</head>

<body>

  <!-- Background -->
  <img src="../Images/contactbackground.png" id="contactBG" alt="Contact Background">

  <!-- ===============================
       CUPID IMAGES (LAYERED ABOVE BG)
       =============================== -->

  <!-- BLUE UFO CUPID -->
  <img src="../Images/bluecupidufocontact.png" id="cupidBlueUFO" alt="Blue Cupid UFO">

  <!-- RED & YELLOW CUPIDS -->
  <img src="../Images/redandyellowcupids.png" id="cupidRedYellow" alt="Red and Yellow Cupids">

  <!-- ===============================
       HOME BUTTON
    =============================== -->
  <a href="../index.html?overlay=1">
    <img src="../Images/purplebutton.png" id="homeButton" alt="Go Home">
  </a>

</body>
</html>
