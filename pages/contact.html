<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Honey Space – Contact</title>

  <style>

    /* ===============================
       1. GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: black;
      color: black;
    }


    /* ===============================
       2. BACKGROUND IMAGE
    =============================== */
    #contactBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }


    /* ===============================
       3. CUPID IMAGES
    =============================== */

    /* -------------------------------
       BLUE CUPID (GROW ANIMATION)
    ------------------------------- */
    #cupidBlueUFO {
      position: absolute;

      top: 190px;
      left: 50px;

      width: 1175px;
      z-index: 2;

      transform-origin: center;

      /* ✨ ENTER ANIMATION */
      animation: cupidGrowIn 2.5s ease-out forwards;
    }


    /* -------------------------------
       RED + YELLOW CUPIDS (FLOAT)
    ------------------------------- */
    #cupidRedYellow {
      position: absolute;

      top: 685px;
      left: 50px;

      width: 1150px;
      z-index: 2;

      animation: dreamyFloat 6s ease-in-out infinite;
    }


    /* ===============================
       4. ANIMATIONS
    =============================== */

    /* BLUE CUPID GROW-IN EFFECT */
    @keyframes cupidGrowIn {
      0% {
        transform: scale(0.2);
        opacity: 0;
      }

      80% {
        transform: scale(1.05);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }


    /* FLOATING CUPID MOTION */
    @keyframes dreamyFloat {
      0%   { transform: translate(0px, 0px) rotate(0deg); }
      25%  { transform: translate(5px, -10px) rotate(1deg); }
      50%  { transform: translate(0px, -20px) rotate(0deg); }
      75%  { transform: translate(-5px, -10px) rotate(-1deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }


    /* ===============================
       5. CONTACT FORM CONTAINER
    =============================== */
    #contactFormContainer {
      position: absolute;

      top: 500px;
      left: 500px;

      width: 350px;

      z-index: 3;
      color: white;
    }


    /* ===============================
       6. FORM STYLE BOX
    =============================== */
    #contactForm {
      background: rgba(0,0,0,0.6);
      border: 1px solid white;
      padding: 20px;
      backdrop-filter: blur(6px);
    }


    /* ===============================
       7. INPUT FIELDS
    =============================== */
    #contactForm input,
    #contactForm textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 15px;

      background: rgba(255,255,255,0.1);
      border: 1px solid white;
      color: white;
    }

    #contactForm textarea {
      resize: none;
    }


    /* ===============================
       8. SUBMIT BUTTON (NEW IMAGE)
       purplebuttonoff.png (#9023f4 theme)
    =============================== */
    #contactForm button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      width: 100%;
    }

    #contactForm button img {
      width: 180px; /* adjust size */
      transition: transform 0.2s ease;
      display: block;
      margin: 0 auto;
    }

    #contactForm button img:hover {
      transform: scale(1.15);
    }


    /* ===============================
       9. SUCCESS MESSAGE (OPTIONAL)
    =============================== */
    #formSuccess {
      display: none;
      color: #9023f4;
      margin-top: 10px;
    }


    /* ===============================
       10. HOME BUTTON
    =============================== */
    #homeButton {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 50px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeButton:hover {
      transform: scale(1.2);
    }

  </style>
</head>


<body>

  <!-- ===============================
       BACKGROUND
  =============================== -->
  <img src="../Images/contactbackground.png" id="contactBG">


  <!-- ===============================
       CUPIDS
  =============================== -->
  <img src="../Images/bluecupidufocontact.png" id="cupidBlueUFO">
  <img src="../Images/redandyellowcupids.png" id="cupidRedYellow">


  <!-- ===============================
       CONTACT FORM
  =============================== -->
  <div id="contactFormContainer">

    <form id="contactForm"
          action="https://formspree.io/f/mlgoqenk"
          method="POST">

      <label>Name</label>
      <input type="text" name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Message</label>
      <textarea name="message" rows="5" required></textarea>

      <!-- SUBMIT --> 
      <button type="submit">Send Message</button> 
      
      <!-- SUCCESS TEXT --> 
      <div id="formSuccess">✨ Message sent successfully!</div> 
    </form>

  </div>


  <!-- ===============================
       HOME BUTTON
  =============================== -->
  <a href="../index.html?overlay=1">
    <img src="../Images/purplebuttonon.png" id="homeButton">
  </a>

</body>
</html>
