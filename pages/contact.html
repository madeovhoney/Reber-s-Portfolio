<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- GOOGLE FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap"
    rel="stylesheet"
  >

  <title>Honey Space – Contact</title>

  <style>

    /* ==========================================
       GLOBAL STYLING
    ========================================== */
    body {
      margin: 0;
      padding: 0;

      font-family: 'Shadows Into Light', cursive;

      background: black;
      color: black;

      overflow-x: hidden;
    }

    /* ==========================================
       BACKGROUND WRAPPER
    ========================================== */
    .bg-wrapper {
      width: 100%;

      position: relative;

      overflow-x: hidden;
      overflow-y: hidden;
    }

    /* ==========================================
       BACKGROUND IMAGE
    ========================================== */
    #contactBG {
      width: 100%;
      height: auto;

      max-width: 1920px;

      display: block;
    }

    /* ==========================================
       BLUE UFO CUPID
    ========================================== */
    #cupidBlueUFO {
      position: absolute;

      top: 190px;
      left: 50px;

      width: 1175px;

      z-index: 10;

      animation: cupidGrowIn 2.5s ease-out forwards;
    }

    /*
      DESKTOP UFO ADJUSTMENTS

      top: 100px = higher
      top: 300px = lower

      left: 0px   = more left
      left: 200px = more right

      width: 800px  = smaller
      width: 1400px = larger
    */

    /* ==========================================
       RED / YELLOW CUPIDS
    ========================================== */
    #cupidRedYellow {
      position: absolute;

      top: 685px;
      left: 50px;

      width: 1150px;

      z-index: 2;

      animation: dreamyFloat 6s ease-in-out infinite;
    }

    /*
      RED / YELLOW CUPID ADJUSTMENTS

      top: 500px = higher
      top: 900px = lower

      left: 0px   = more left
      left: 200px = more right
    */

    /* ==========================================
       CONTACT FORM CONTAINER
    ========================================== */
    #contactFormContainer {
      position: absolute;

      /* DESKTOP POSITION ADJUSTMENTS */
      top: 650px;
      left: 50%;

      transform: translateX(-50%);

      width: 350px;

      z-index: 3;

      color: white;
    }

    /*
      DESKTOP CONTACT FORM ADJUSTMENTS

      top: 400px = higher
      top: 700px = lower

      left: 45% = more left
      left: 55% = more right

      width: 300px = smaller
      width: 500px = larger
    */

    /* ==========================================
       CONTACT FORM
    ========================================== */
    #contactForm {
      background: rgba(0,0,0,0.6);

      border: 1px solid white;

      padding: 32px;
    }

    #contactForm input,
    #contactForm textarea {

      width: 100%;

      padding: 12px;
      margin-bottom: 15px;

      background: rgba(255,255,255,0.1);

      border: 1px solid white;

      color: white;

      box-sizing: border-box;
    }

    #contactForm button {

      width: 100%;

      padding: 12px;

      background: #9023f4;

      border: none;

      color: white;

      cursor: pointer;

      border-radius: 6px;
    }

    /* ==========================================
       HOME LOGO
    ========================================== */
    #homeLogo {
      position: fixed;

      top: 130px;
      left: 400px;

      width: 525px;

      z-index: 1000;

      cursor: pointer;

      transition: transform 0.2s ease;
    }

    #homeLogo:hover {
      transform: scale(1.1);
    }

    /*
      HOME LOGO ADJUSTMENTS

      top: 50px  = higher
      top: 200px = lower

      left: 100px = more left
      left: 600px = more right
    */

    /* ==========================================
       ANIMATIONS
    ========================================== */
    @keyframes cupidGrowIn {

      0% {
        transform: scale(0.2);
        opacity: 0;
      }

      80% {
        transform: scale(1.05);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes dreamyFloat {

      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-20px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    /* ==========================================
       MOBILE / TABLET***************************************************************************************************
    ========================================== */
    @media (max-width: 768px) {

      /* ======================================
         MOBILE BODY
      ====================================== */
      body {
        overflow-x: auto;
      }

      /* ======================================
         MOBILE BACKGROUND WRAPPER
      ====================================== */
      .bg-wrapper {
        width: 100vw;
        height: 100vh;

        position: relative;

        overflow-x: scroll;
        overflow-y: scroll;
      }

      /* ======================================
         MOBILE BACKGROUND IMAGE
      ====================================== */
      #contactBG {

        height: 100vh;
        width: auto;

        min-width: 150vw;

        object-fit: cover;

        display: block;
      }

      /*
        MOBILE BACKGROUND ADJUSTMENTS

        min-width: 120vw = less horizontal area
        min-width: 200vw = more horizontal area
      */

      /* ======================================
         MOBILE HOME LOGO
      ====================================== */
      #homeLogo {
        position: fixed;

        top: 50px;
        left: 90%;

        width: 240px;

        transform: translateX(-50%);

        z-index: 1000;
      }

      /* ======================================
         MOBILE BLUE UFO
      ====================================== */
      #cupidBlueUFO {
        position: absolute;

        top: 120px;
        left: 30%;

        width: 600px;

        transform: translateX(-50%);

        z-index: 10;

        animation: cupidGrowIn 2.5s ease-out forwards;
      }

      /*
        MOBILE UFO ADJUSTMENTS

        top: 50px  = higher
        top: 250px = lower

        left: 10% = more left
        left: 50% = more right

        width: 400px = smaller
        width: 900px = larger
      */

      /* ======================================
         MOBILE RED / YELLOW CUPIDS
      ====================================== */
      #cupidRedYellow {
        position: absolute;

        top: 470px;
        left: 25%;

        width: 700px;

        transform: translateX(-50%);

        z-index: 2;
      }

      /*
        MOBILE RED / YELLOW ADJUSTMENTS

        top: 350px = higher
        top: 700px = lower

        left: 10% = more left
        left: 50% = more right
      */

      /* ======================================
         MOBILE CONTACT FORM CONTAINER
      ====================================== */
      #contactFormContainer {
        position: absolute;

        /* MOBILE POSITION ADJUSTMENTS */
        top: 400px;
        left: 95%;

        transform: translateX(-50%);

        width: 90%;
        max-width: 350px;

        box-sizing: border-box;

        z-index: 5;
      }

      /*
        MOBILE CONTACT FORM ADJUSTMENTS

        top: 400px = higher
        top: 700px = lower

        left: 45% = more left
        left: 55% = more right

        max-width: 300px = smaller
        max-width: 450px = larger
      */

      /* ======================================
         MOBILE CONTACT FORM
      ====================================== */
      #contactForm {
        padding: 24px;
      }

      /* ======================================
         MOBILE INPUTS / TEXTAREA
      ====================================== */
      #contactForm input,
      #contactForm textarea {

        font-size: 1rem;
      }

      /* ======================================
         MOBILE BUTTON
      ====================================== */
      #contactForm button {

        font-size: 1rem;
      }
    }

  </style>
</head>

<body>

  <!-- ======================================
       BACKGROUND WRAPPER
  ======================================= -->
  <div class="bg-wrapper">

    <!-- BACKGROUND -->
    <img
      src="../Images/contact-background.png?v=3"
      id="contactBG"
      alt="Contact Background"
    >

    <!-- BLUE UFO -->
    <img
      src="../Images/bluecupidufocontact.png?v=3"
      id="cupidBlueUFO"
      alt=""
    >

    <!-- RED / YELLOW CUPIDS -->
    <img
      src="../Images/redandyellowcupids.png?v=3"
      id="cupidRedYellow"
      alt=""
    >

    <!-- CONTACT FORM -->
    <div id="contactFormContainer">

      <form
        id="contactForm"
        action="https://formspree.io/f/mlgoqenk"
        method="POST"
      >

        <input
          type="text"
          name="name"
          placeholder="Name"
          required
        >

        <input
          type="email"
          name="email"
          placeholder="Email"
          required
        >

        <textarea
          name="message"
          rows="5"
          placeholder="Message"
          required>
        </textarea>

        <button type="submit">
          Send Message
        </button>

      </form>

    </div>

  </div>

  <!-- HOME LOGO -->
  <a href="../index.html">

    <img
      src="../Images/contact-homebuttonlogo.png?v=3"
      id="homeLogo"
      alt="Home"
    >

  </a>

</body>
</html>
