<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <title>Honey Space – Blog</title>

  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Shadows Into Light', cursive;
      background: black;
      color: white; /* FIXED visibility */
    }

    /* ===============================
       BACKGROUND IMAGE
    =============================== */
    #blogBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }

    /* ===============================
       CONTENT
    =============================== */
    .content {
      position: absolute;
      z-index: 1;

      top: 150px;
      left: 700px;

      max-width: 1200px;
      padding: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* ===============================
       CRIMSON WORDPRESS LINK
    =============================== */
    .blog-link {
      color: crimson;
      text-decoration: none;
      font-size: 1.3rem;
    }

    .blog-link:hover {
      color: #ff4d4d; /* lighter red on hover */
      text-decoration: underline;
    }

    /* ===============================
       HOME BUTTON
    =============================== */
    #homeButton {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 60px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeButton:hover {
      transform: scale(1.2);
    }

    /* ===============================
       BEE IMAGE
    =============================== */
    #beeImage {
      position: absolute;
      top: 775px;
      left: 700px;
      width: 100px;
      z-index: 2;

      animation: floatBees 4s ease-in-out infinite;
    }

    @keyframes floatBees {
      0%   { transform: translateY(0px); }
      50%  { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>

<body>

  <!-- Background -->
  <img src="../Images/blog-background.png" id="blogBG" alt="Blog Background">

  <!-- Home Button -->
  <a href="../index.html?overlay=1">
    <img src="../Images/homebutton-logo.png" id="homeButton" alt="Home">
  </a>

  <!-- Bees -->
  <img src="../Images/BeeLovers-blogpage.png" id="beeImage" alt="Bee Lovers">

  <!-- Content -->
  <div class="content">
    <p>
      After taking an intense Newswriting class, I was inspired to keep a personal portfolio of scientific research 
      I found interesting and important, with a focus on peer-reviewed and credible information for the public.
    </p>

    <p>To read more, click below:</p>

    <p>
      <a href="https://reberkk.wordpress.com/" target="_blank" class="blog-link">
        Visit My WordPress Blog
      </a>
    </p>
  </div>

</body>
</html>
