<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honey Space – Blog</title>
  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: sans-serif;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; /* viewport height */
    }

    /* ===============================
       FULLSCREEN BACKGROUND IMAGE (fully visible)
    =============================== */
    #blogBG {
      width: 100vw;        /* full viewport width */
      height: 100vh;       /* full viewport height */
      object-fit: contain; /* scale so the entire image is visible */
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;          /* behind content */
      background-color: black; /* fills empty space */
    }

    /* ===============================
       PAGE CONTENT
    =============================== */
    .content {
      position: relative;
      z-index: 1;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
      max-width: 800px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <!-- Full Blog Background -->
  <img src="../Images/blog-background.png" id="blogBG" alt="Blog Background">

  <!-- Page Content -->
  <div class="content">
    <h1>Blog</h1>
    <p>Welcome to the Honey Space blog. Here’s your content displayed on top of the full background image, fully visible without cropping.</p>
  </div>

</body>
</html>
