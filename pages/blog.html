<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honey Space – Blog</title>
  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: black;
      color: white;
    }

    /* ===============================
       SCROLLABLE FULL-BACKGROUND IMAGE
    =============================== */
    #blogBG {
      width: 100%;
      height: auto;           /* allow natural height */
      max-width: 1920px;      /* optional: limit very large images */
      display: block;
    }

    /* ===============================
       PAGE CONTENT
    =============================== */
    .content {
      position: relative;
      z-index: 1;
      padding: 50px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Scrollable Blog Background -->
  <img src="../Images/blog-background.png" id="blogBG" alt="Blog Background">

  <!-- Page Content -->
  <div class="content">
    <h1>Blog</h1>
    <p>Welcome to the Honey Space blog. The background scrolls with the page, just like on the homepage, keeping it visually consistent.</p>
    <p>Keep adding posts or sections here. The image will move naturally as you scroll.</p>
  </div>

</body>
</html>
