<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honey Space – Blog</title>
  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: sans-serif;
      background: black;
    }

    /* ===============================
       FULLSCREEN BACKGROUND IMAGE
    =============================== */
    #blogBG {
      width: 90vw;       /* full viewport width */
      height: 90vh;      /* full viewport height */
      object-fit: cover;   /* scale and crop to fill screen */
      display: block;
      position: fixed;     /* stays behind content */
      top: 200;
      left: 0;
      z-index: -1;         /* behind all other content */
    }

    /* ===============================
       PAGE CONTENT
    =============================== */
    .content {
      position: relative;
      z-index: 1;
      color: white;
      padding: 50px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Blog Background -->
  <img src="../Images/blog-background.png" id="blogBG" alt="Blog Background">

  <!-- Page Content -->
  <div class="content">
    <h1>Blog</h1>
    <p>Welcome to the Honey Space blog. Add your posts and content here!</p>
  </div>

</body>
</html>
