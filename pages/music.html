<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Honey Space – Music</title>

  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: black;
      color: black;
    }

    /* ===============================
       BACKGROUND IMAGE
    =============================== */
    #musicBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }

    /* ===============================
       CONTENT (DESKTOP)
    =============================== */
    .content {
      position: absolute;
      z-index: 1;

      top: 600px;
      left: 500px;

      max-width: 1200px;
      padding: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* ===============================
       SPOTIFY PLAYER (DESKTOP)
    =============================== */
    .spotify-player {
      position: absolute;
      top: 200px;
      left: 500px;
      z-index: 2;
    }

    /* ===============================
       HOME BUTTON
    =============================== */
    #homeButton {
      position: fixed;
      top: 10px;
      left: 15px;
      width: 450px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeButton:hover {
      transform: scale(1.2);
    }

    /* ===============================
       MOBILE / TABLET
    =============================== */
    @media (max-width: 768px) {

      body {
        overflow-x: hidden;
        color: white; /* ensures text is visible */
      }

      /* Center logo */
      #homeButton {
        left: 50%;
        transform: translateX(-50%);
        width: 250px;
      }

      /* Spotify player */
      .spotify-player {
        position: relative;
        top: auto;
        left: auto;

        display: block;
        margin: 120px auto 20px auto;
        text-align: center;
      }

      .spotify-player iframe {
        width: 90%;
        max-width: 350px;
        height: 350px;
      }

      /* Content */
      .content {
        position: relative;
        top: auto;
        left: auto;

        margin: 20px;
        max-width: 100%;
        text-align: center;
      }

      p {
        font-size: 1rem;
        line-height: 1.5;
      }
    }
  </style>
</head>

<body>

  <!-- Background -->
  <img src="../Images/music-background.png?v=2" id="musicBG" alt="Music Background">

  <!-- Home Button -->
  <a href="../index.html?overlay=1">
    <img src="../Images/homebutton-logo.png" id="homeButton" alt="Home">
  </a>

  <!-- Spotify Player -->
  <div class="spotify-player">
    <iframe style="border-radius:12px"
      src="INSERT MY SPOTIFY PLAYLIST LINK"
      width="400"
      height="400"
      frameborder="0"
      allowfullscreen=""
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
    </iframe>
  </div>

  <!-- Content -->
  <div class="content">
    <p>A Spotify music player with my personal playlist is below.</p>
    <p>We'll dance soon, so please standby.</p>
  </div>

</body>
</html>
