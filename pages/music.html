<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Honey Space – Music</title>

  <style>

    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;

      font-family: Arial, Helvetica, sans-serif;

      background: black;

      overflow: auto;
    }

    /* ===============================
       SCROLLABLE CANVAS
    =============================== */
    .scene {
      position: relative;

      width: 220vw;
      height: 140vh;

      overflow: visible;
    }

    /* ===============================
       BACKGROUND
    =============================== */
    #musicBG {
      position: absolute;

      top: 0;
      left: 0;

      width: 220vw;
      height: 100vh;

      object-fit: cover;
      object-position: top;

      display: block;

      z-index: 1;
    }

    /* ===============================
       HOME BUTTON
    =============================== */
    #homeButton {
      position: fixed;

      top: 10px;
      left: 50%;

      width: 250px;

      transform: translateX(-50%);

      z-index: 1000;

      cursor: pointer;
    }

    /* ===============================
       SPOTIFY PLAYER
    =============================== */
    .spotify-player {
      position: absolute;

      top: 140px;
      left: 120px;

      z-index: 2;
    }

    .spotify-player iframe {
      width: 350px;
      height: 352px;
    }

    /* ===============================
       CONTENT
    =============================== */
    .content {
      position: absolute;

      top: 540px;
      left: 60px;

      width: 350px;

      text-align: center;

      color: white;

      z-index: 2;
    }

    p {
      font-size: 1rem;
      line-height: 1.5;
    }

    /* ===============================
       DESKTOP
    =============================== */
    @media (min-width: 609px) {

      .scene {
        width: 100vw;
        height: 100vh;
      }

      #musicBG {
        width: 100%;
        height: auto;

        max-width: 1920px;
      }

      .spotify-player {
        top: 175px;
        left: 50%;

        transform: translateX(-50%);
      }

      .content {
        top: 550px;
        left: 50%;

        transform: translateX(-50%);

        width: 900px;

        color: black;
      }

      #homeButton {
        left: 15px;

        width: 450px;

        transform: none;
      }

      p {
        font-size: 1.2rem;
      }
    }

  </style>
</head>

<body>

  <!-- Home Button -->
  <a href="../index.html?overlay=1">
    <img
      src="../Images/homebutton-logo.png"
      id="homeButton"
      alt="Home">
  </a>

  <!-- SCROLLABLE SCENE -->
  <div class="scene">

    <!-- Background -->
    <img
      src="../Images/music-background.png?v=2"
      id="musicBG"
      alt="Music Background">

    <!-- Spotify Player -->
    <div class="spotify-player">

      <iframe
        data-testid="embed-iframe"
        style="border-radius:12px"
        src="https://open.spotify.com/embed/playlist/1D0fywty51wFsEnSvdtUTW?utm_source=generator&theme=0"
        width="100%"
        height="352"
        frameborder="0"
        allowfullscreen
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>

    </div>

    <!-- Content -->
    <div class="content">

      <p>
        Music has always been an essential part of my life!<br>
        If dancing and singing in the kitchen, car, or shower is something
        you can relate to, enjoy this list of my top 10 picks.
      </p>

      <p>
        Let's keep music strong, no matter the profession.
      </p>

    </div>

  </div>

</body>
</html>
