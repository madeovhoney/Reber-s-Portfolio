<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <title>Honey Space – Music</title>

  <style>
    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Shadows Into Light', cursive;
      background: black;
      color: black; /* FIXED visibility */
    }

    /* ===============================
       BACKGROUND IMAGE
    =============================== */
    #musicBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }

    /* ===============================
       CONTENT
    =============================== */
    .content {
      position: absolute;
      z-index: 1;

      top: 550px;
      left: 300px;

      max-width: 1200px;
      padding: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* ===============================
       SPOTIFY PLAYER
    =============================== */
    .spotify-player {
      margin-top: 15px;
    }

    /* ===============================
       HOME BUTTON
    =============================== */
    #homeButton {
      position: fixed;
      top: 40px;
      left: 40px;
      width: 400px;
      z-index: 1000;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #homeButton:hover {
      transform: scale(1.2);
    }
  </style>
</head>

<body>

  <!-- Background (cache-busted so it refreshes) -->
  <img src="../Images/music-background.png?v=2" id="musicBG" alt="Music Background">

  <!-- Home Button -->
  <a href="../index.html?overlay=1">
    <img src="../Images/homebutton-logo.png" id="homeButton" alt="Home">
  </a>

  <!-- Content -->
  <div class="content">
    <p>A Spotify music player with my personal playlist is below.</p>
    <p>We'll dance soon, so please standby.</p>

    <!-- 🎧 SPOTIFY EMBED (replace with my playlist later) -->
    <div class="spotify-player">
      <iframe style="border-radius:12px"
        src="INSERT MY SPOTIFY PLAYLIST LINK"
        width="500"
        height="500"
        frameborder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>
    </div>
  </div>

</body>
</html>
