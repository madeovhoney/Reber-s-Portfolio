<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Honey Space – Music</title>

  <style>

    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: black;
      color: black;
      overflow-x: hidden;
    }

    /* ===============================
       BACKGROUND WRAPPER
    =============================== */
    .bg-wrapper {
      width: 100%;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    /* ===============================
       BACKGROUND IMAGE
    =============================== */
    #musicBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }

    /* ===============================
       CONTENT (DESKTOP)
    =============================== */
    .content {
      position: absolute;
      z-index: 1;

      top: 600px;
      left: 500px;

      max-width: 1200px;
      padding: 20px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* ===============================
       SPOTIFY PLAYER (DESKTOP)
    =============================== */
    .spotify-player {
      position: absolute;

      top: 200px;
      left: 500px;

      z-index: 2;
    }

    /* ===============================
       HOME BUTTON
    =============================== */
    #homeButton {
      position: fixed;

      top: 10px;
      left: 15px;

      width: 450px;

      z-index: 1000;
      cursor: pointer;

      transition: transform 0.2s ease;
    }

    #homeButton:hover {
      transform: scale(1.2);
    }

    /* ===============================
       MOBILE / TABLET********************************************************************************************
    =============================== */
    @media (max-width: 608px) {

      /* ---------- MOBILE BODY ---------- */
      body {
        overflow-x: auto;
        color: black;
      }

      /* ---------- MOBILE BACKGROUND WRAPPER ---------- */
      .bg-wrapper {
        width: 100vw;
        height: 100vh;

        overflow-x: scroll;
        overflow-y: hidden;
      }

      /* ---------- MOBILE BACKGROUND ---------- */
      #musicBG {
        height: 100vh;
        width: auto;

        min-width: 150vw;

        object-fit: cover;

        display: block;
      }

      /* ---------- MOBILE HOME BUTTON ---------- */
      #homeButton {
        position: fixed;

        top: 10px;
        left: 40%;

        width: 250px;

        transform: translateX(-50%);
      }

/* ---------- MOBILE SPOTIFY PLAYER ---------- */
.spotify-player {
  position: fixed;

  top: 140px;
  left: 50%;

  transform: translateX(-50%);

  display: flex;
  justify-content: center;

  width: 100%;

  padding: 0 20px;

  box-sizing: border-box;

  z-index: 999;
}

/* ---------- MOBILE SPOTIFY IFRAME ---------- */
.spotify-player iframe {
  width: 100%;
  max-width: 350px;
  height: 350px;
}

      /* ---------- MOBILE CONTENT ---------- */
      .content {
        position: relative;

        top: auto;
        left: auto;

        margin-top: 20px;
        padding: 0 20px;

        max-width: 100%;

        text-align: center;

        transform: translateX(0px);

        z-index: 2;
      }

      /* ---------- MOBILE TEXT ---------- */
      p {
        font-size: 1rem;
        line-height: 1.5;
      }
    }

  </style>
</head>

<body>

  <!-- Background Wrapper -->
  <div class="bg-wrapper">

    <!-- Background -->
    <img
      src="../Images/music-background.png?v=2"
      id="musicBG"
      alt="Music Background"
    >

  </div>

  <!-- Home Button -->
  <a href="../index.html?overlay=1">
    <img src="../Images/homebutton-logo.png" id="homeButton" alt="Home">
  </a>

  <!-- Spotify Player -->
  <div class="spotify-player">

  <!-- Spotify Player -->
<iframe
  data-testid="embed-iframe" 
  style="border-radius:12px" src="https://open.spotify.com/embed/playlist/1D0fywty51wFsEnSvdtUTW?utm_source=generator&theme=0" 
  width="100%" 
  height="352" 
  frameBorder="0" 
  allowfullscreen="" 
  allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy">
</iframe>
  
</div>
  <!-- Content -->
  <div class="content">

    <p>
      Music has always been an essential part of my life!<br>
      If dancing and singing in the kitchen, car, and shower is something<br>
      you can relate to, please enjoy this list of my top 10 picks.
    </p>

    <p>
      We'll dance soon, so please standby.
    </p>

  </div>

</body>
</html>
