<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Honey Space – Music</title>

  <style>

    /* ===============================
       GLOBAL STYLING
    =============================== */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: black;
      color: black;
      overflow-x: hidden;
    }

    /* ===============================
       BACKGROUND WRAPPER
    =============================== */
    .bg-wrapper {
      width: 100%;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    /* ===============================
       BACKGROUND IMAGE
    =============================== */
    #musicBG {
      width: 100%;
      height: auto;
      max-width: 1920px;
      display: block;
    }

    /* ===============================
       DESKTOP SPOTIFY PLAYER
    =============================== */
    .spotify-player {
      position: absolute;

      top: 175px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 2;
    }

    /* ===============================
       DESKTOP CONTENT
    =============================== */
    .content {
      position: absolute;

      top: 550px;
      left: 50%;

      transform: translateX(-50%);

      text-align: center;

      max-width: 900px;
      padding: 20px;

      z-index: 2;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* ===============================
       HOME BUTTON
    =============================== */
    #homeButton {
      position: fixed;

      top: 10px;
      left: 15px;

      width: 450px;

      z-index: 1000;
      cursor: pointer;

      transition: transform 0.2s ease;
    }

    #homeButton:hover {
      transform: scale(1.1);
    }

    /* ===============================
       MOBILE / TABLET**************************************************************************
    =============================== */
    @media (max-width: 608px) {

      body {
        overflow-x: auto;
        color: black;
      }

      /* ---------- MOBILE BACKGROUND WRAPPER ---------- */
      .bg-wrapper {
        width: 100vw;
        height: 100vh;

        overflow-x: scroll;
        overflow-y: hidden;
      }

      /* ---------- MOBILE BACKGROUND ---------- */
      #musicBG {
        height: 100vh;
        width: auto;

        min-width: 220vw;

        object-fit: cover;

        object-position: top;

        display: block;
      }

      /* ---------- MOBILE HOME BUTTON ---------- */
      #homeButton {
        position: fixed;

        top: 10px;
        left: 50%;

        width: 250px;

        transform: translateX(-50%);

        z-index: 1000;
      }

   /* ---------- MOBILE SPOTIFY PLAYER ---------- */
.spotify-player {
  position: absolute;

  top: 140px;
  left: 120px;

  z-index: 2;

        /* LEFT / RIGHT ADJUSTMENT */
        transform: translateX(-50px);
      }

      /* ---------- MOBILE SPOTIFY IFRAME ---------- */
      .spotify-player iframe {
        width: 350px;
        height: 352px;
      }

      /* ---------- MOBILE CONTENT ---------- */
      .content {
        position: absolute;

        top: 500px;
        left: 50%;

        width: 90%;

        text-align: center;

        z-index: 2;

        /* LEFT / RIGHT ADJUSTMENT */
        transform: translateX(-50px);
      }

      /* ---------- MOBILE TEXT ---------- */
      p {
        font-size: 1rem;
        line-height: 1.5;
      }
    }

  </style>
</head>

<body>

  <!-- Background Wrapper -->
  <div class="bg-wrapper">

    <!-- Background -->
    <img
      src="../Images/music-background.png?v=2"
      id="musicBG"
      alt="Music Background"
    >

  </div>

  <!-- Home Button -->
  <a href="../index.html?overlay=1">
    <img
      src="../Images/homebutton-logo.png"
      id="homeButton"
      alt="Home"
    >
  </a>

  <!-- Spotify Player -->
  <div class="spotify-player">

    <iframe
      data-testid="embed-iframe"
      style="border-radius:12px"
      src="https://open.spotify.com/embed/playlist/1D0fywty51wFsEnSvdtUTW?utm_source=generator&theme=0"
      width="100%"
      height="352"
      frameborder="0"
      allowfullscreen
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>

  </div>

  <!-- Content -->
  <div class="content">

    <p>
      Music has always been an essential part of my life!<br>
      If dancing and singing in the kitchen, car, or shower is something<br>
      you can relate to, enjoy this list of my top 10 picks.
    </p>

    <p>
      Let's keep music strong, no matter the profession.
    </p>

  </div>

</body>
</html>
