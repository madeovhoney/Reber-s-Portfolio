<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Space</title>

<style>

/* ================= GLOBAL ================= */
body {
  margin: 0;
  padding: 0;
  background: black;
  overflow-x: hidden;
}

.container {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
}

/* ================= BACKGROUND ================= */
.background {
  display: block;
  width: 100%;
  height: auto;
  z-index: 1;
}

/* ================= EART HED OVERLAY ================= */
.earthed-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  opacity: 0;
  transition: opacity 1.2s ease-in-out;
  pointer-events: none;
  z-index: 3;
}

.earthed-overlay.active {
  opacity: 1;
}

/* ================= FLICKERS ================= */
.flicker-layer {
  position: absolute;
  opacity: 1;
  z-index: 2;
  pointer-events: none;
  filter: brightness(1);
  transition: filter 0.05s ease-in-out;
}

.flash {
  filter: brightness(3);
}

/* ================= LOGO ================= */
.logo {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  z-index: 6;
}

/* ================= BUTTONS ================= */
.nav-group {
  position: absolute;
  z-index: 6;
}

.nav-group img {
  display: block;
  height: auto;
}

/* Hide overlay versions by default */
.overlay-version {
  display: none;
}

/* When active, swap */
.overlay-active .normal-version {
  display: none;
}

.overlay-active .overlay-version {
  display: block;
}

/* ================= PURPLE BUTTON ================= */
.switch-button {
  position: absolute;
  top: 500px;
  left: 50%;
  transform: translateX(-50%);
  width: 75px;
  z-index: 10;
  cursor: pointer;
}

.switch-button img {
  width: 100%;
  height: auto;
}

</style>
</head>

<body>

<div class="container" id="mainContainer">

  <!-- Background -->
  <img id="background" class="background" alt="Background">

  <!-- Earthed Fade Overlay -->
  <img id="earthedOverlay"
       class="earthed-overlay"
       src="images/Earthedoverlayfadein.png"
       alt="Earthed Overlay">

  <!-- ================= FLICKERS ================= -->
  <img id="flicker1" class="flicker-layer"
       style="width:1275px; top:-150px; left:-89px;"
       src="images/Flowersandboltflicker.png">

  <img id="flicker2" class="flicker-layer"
       style="width:189px; top:825px; left:500px;"
       src="images/Boltandheartflicker.png">

  <img id="flicker3" class="flicker-layer"
       style="width:675px; top:250px; left:25px;"
       src="images/Boltandstarflicker.png">

  <img id="flicker4" class="flicker-layer"
       style="width:100px; top:85px; left:575px;"
       src="images/Starsflicker.png">

  <img id="flicker5" class="flicker-layer"
       style="width:650px; top:825px; left:10px;"
       src="images/starandalienflicker.png">

  <img id="flicker6" class="flicker-layer"
       style="width:575px; top:7px; left:480px;"
       src="images/flowersflicker.png">

  <!-- ================= LOGO ================= -->
  <img src="images/Logoandbeelight.png" class="logo">

  <!-- ================= NAV BUTTONS ================= -->
  <!-- About -->
  <a href="about.html" class="nav-group" style="top:345px; left:25%;">
    <img src="images/Aboutlinkclick.png" class="normal-version" style="width:85px;">
    <img src="images/Overlayaboutlink.png" class="overlay-version" style="width:85px;">
  </a>

  <!-- Music -->
  <a href="music.html" class="nav-group" style="top:350px; left:57%;">
    <img src="images/Musiclinkclick.png" class="normal-version" style="width:86px;">
    <img src="images/Overlaymusiclink.png" class="overlay-version" style="width:86px;">
  </a>

  <!-- Blog -->
  <a href="blog.html" class="nav-group" style="top:360px; left:46%;">
    <img src="images/bloglinkclick.png" class="normal-version" style="width:81px;">
    <img src="images/Overlaybloglink.png" class="overlay-version" style="width:81px;">
  </a>

  <!-- Gallery -->
  <a href="gallery.html" class="nav-group" style="top:369px; left:35%;">
    <img src="images/Gallerylinkclick.png" class="normal-version" style="width:90px;">
    <img src="images/Overlaygallerylink.png" class="overlay-version" style="width:90px;">
  </a>

  <!-- Contact -->
  <a href="contact.html" class="nav-group" style="top:360px; left:67%;">
    <img src="images/contactlinkclick.png" class="normal-version" style="width:80px;">
    <img src="images/Overlaycontactlink.png" class="overlay-version" style="width:80px;">
  </a>

  <!-- ================= PURPLE BUTTON ================= -->
  <div id="toggleOverlay" class="switch-button">
    <img src="images/purplebutton.png">
  </div>

</div>

<script>

document.addEventListener('DOMContentLoaded', () => {

  // Background
  document.getElementById('background').src =
    "images/BlackUnearthBackground.png";

  // Flicker logic
  function flashFlicker(img) {
    function cycle() {
      const flashes = Math.floor(Math.random()*3)+1;
      let count = 0;

      function flash() {
        img.classList.add('flash');
        setTimeout(() => {
          img.classList.remove('flash');
          count++;
          if(count < flashes) {
            setTimeout(flash, 70 + Math.random()*80);
          } else {
            setTimeout(cycle, 10000 + Math.random()*5000);
          }
        }, 70);
      }

      flash();
    }
    setTimeout(cycle, Math.random()*8000);
  }

  document.querySelectorAll('.flicker-layer')
    .forEach(flashFlicker);

  // Overlay toggle
  const container = document.getElementById('mainContainer');
  const overlay = document.getElementById('earthedOverlay');
  const toggle = document.getElementById('toggleOverlay');

  toggle.addEventListener('click', () => {
    overlay.classList.toggle('active');
    container.classList.toggle('overlay-active');
  });

});

</script>

</body>
</html>
