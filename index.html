<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Space Flicker Animation</title>

<style>
/* =======================================================
   1. GLOBAL STYLING
   ======================================================= */
body {
  margin: 0;
  padding: 0;
  background: black;       /* Base background color */
  overflow-x: hidden;      /* Prevent horizontal scroll */
}

.container {
  position: relative;      /* Allows absolute positioning of child elements */
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
  background: black;
}

/* =======================================================
   2. MAIN BACKGROUND IMAGE
   ======================================================= */
.background {
  display: block;
  width: 100%;             /* Full width of viewport */
  height: auto;            /* Maintain aspect ratio */
  z-index: 1;              /* Base layer */
}

/* =======================================================
   3. FLICKER IMAGES (OVERLAY)
   ======================================================= */
.flicker-layer {
  position: absolute;      /* Overlay on top of background */
  top: 0;                  /* Default top (override individually) */
  left: 0;                 /* Default left (override individually) */
  width: auto;             /* Default size (override individually) */
  height: auto;            /* Default size (override individually) */
  opacity: 1;              /* Default visibility */
  z-index: 2;              /* Above background but below logo/buttons */
  pointer-events: none;    /* Allows clicks to pass through to buttons */
  animation-name: flickerAnimation;
  animation-duration: 5s;  /* Default flicker cycle */
  animation-iteration-count: infinite;
  animation-timing-function: ease-in-out;
}

/* Flicker keyframes: fade in/out effect */
@keyframes flickerAnimation {
  0%, 20%, 40%, 60%, 80%, 100% { opacity: 1; }
  10%, 30%, 50%, 70%, 90% { opacity: 0.3; }
}

/* =======================================================
   4. MAIN LOGO
   ======================================================= */
.logo {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  z-index: 5;
}

/* =======================================================
   5. NAVIGATION BUTTONS
   ======================================================= */
.original-button {
  position: absolute;
  display: block;
  z-index: 5;
}

.original-button img {
  display: block;
  height: auto;
}

/* =======================================================
   6. PURPLE TOGGLE BUTTON
   ======================================================= */
.switch-button {
  position: absolute;
  top: 475px;
  left: 25%;
  transform: translateX(-50%);
  width: 120px;
  z-index: 1001;
  cursor: pointer;
}

.switch-button img {
  width: 100%;
  height: auto;
  display: block;
}

/* =======================================================
   7. MOBILE RESPONSIVENESS
   ======================================================= */
@media only screen and (max-width: 768px) {
  .logo {
    width: 400px;
    top: 100px;
  }

  .original-button {
    width: 40%;
    left: 50%;
    transform: translateX(-50%);
  }

  .switch-button {
    top: 420px;
    width: 100px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- =====================================================
       MAIN BACKGROUND
       ===================================================== -->
  <img src="images/BlackUnearthBackground.png?v=2" alt="Background" class="background">

  <!-- =====================================================
       FLICKER IMAGES WITH CACHE-BUSTING
       Increment the ?v= number whenever the image is updated
       ===================================================== -->

  <!-- Flicker 1: Flowers and Bolt -->
  <img src="images/Flowersandboltflicker.png?v=2" 
       class="flicker-layer"
       style="width:1200px; top:-100px; left: -100px; animation-delay:0s;">

  <!-- Flicker 2: Bolt and Heart -->
  <img src="images/Boltandheartflicker.png?v=2" 
       class="flicker-layer"
       style="width:300px; top:800px; left:350px; animation-delay:1.5s;">

  <!-- Flicker 3: Bolt and Star -->
  <img src="images/Boltandstarflicker.png?v=2" 
       class="flicker-layer"
       style="width:800px; top:300px; left:15px; animation-delay:3s;">

  <!-- Flicker 4: Stars -->
  <img src="images/Starsflicker.png?v=2" 
       class="flicker-layer"
       style="width:100px; top:85px; left:475px; animation-delay:4.5s;">

  <!-- Flicker 5: Star and Alien -->
  <img src="images/starandalienflicker.png?v=2" 
       class="flicker-layer"
       style="width:750px; top:750px; left:150px; animation-delay:6s;">

  <!-- Flicker 6: Flowers -->
  <img src="images/flowersflicker.png?v=2" 
       class="flicker-layer"
       style="width:575px; top:7px; left:480px; animation-delay:7.5s;">

  <!-- =====================================================
       MAIN LOGO
       ===================================================== -->
  <img src="images/Logoandbeelight.png?v=2" alt="Honey Space Logo" class="logo">

  <!-- =====================================================
       NAVIGATION BUTTONS
       ===================================================== -->
  <a href="about.html" class="original-button" style="top:345px; left:25%;">
    <img src="images/Aboutlinkclick.png?v=2" style="width:85px;">
  </a>

  <a href="music.html" class="original-button" style="top:317px; left:35%;">
    <img src="images/Musiclinkclick.png?v=2" style="width:133px;">
  </a>

  <a href="blog.html" class="original-button" style="top:354px; left:57%;">
    <img src="images/bloglinkclick.png?v=2" style="width:81px;">
  </a>

  <a href="gallery.html" class="original-button" style="top:363px; left:46%;">
    <img src="images/Gallerylinkclick.png?v=2" style="width:90px;">
  </a>

  <a href="contact.html" class="original-button" style="top:348px; left:67%;">
    <img src="images/contactlinkclick.png?v=2" style="width:80px;">
  </a>

  <!-- =====================================================
       PURPLE TOGGLE BUTTON
       ===================================================== -->
  <a href="#" class="switch-button">
    <img src="images/purplebutton.png?v=2" alt="Toggle Overlay">
  </a>

</div>

</body>
</html>
