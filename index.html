<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Space</title>

<style>
body {
  margin: 0;
  padding: 0;
  background: black;
}

.container {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
  background: black;
}

.background, .flicker, .logo {
  display: block;
  width: 100%;
  height: auto;
}

.flicker {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  transform: translateX(-34px) translateY(69px);
  animation: flickerAnimation 7s infinite;
}

@keyframes flickerAnimation {
  0%, 15%, 20%, 25%, 50%, 55%, 100% { opacity: 1; }
  16%, 18%, 22%, 24%, 51%, 54% { opacity: 0.3; }
}

.logo {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  z-index: 5;
}

/* Purple ON/OFF button */
.switch-button {
  position: absolute;
  top: 475px;
  left: 25%;
  transform: translateX(-50%);
  width: 100px;
  height: 50px;
  background-color: purple;
  border: 2px solid #fff;
  border-radius: 25px;
  cursor: pointer;
  color: white;
  font-weight: bold;
  font-family: sans-serif;
  text-align: center;
  line-height: 50px;
  text-decoration: none;
  transition: background 0.3s, transform 0.2s;
  z-index: 1001;
}

.switch-button:hover {
  background-color: #a64ca6;
  transform: scale(1.05);
}

a {
  display: block;
  position: absolute;
}

/* Original buttons */
a.original-button {
  position: absolute;
  display: block;
  z-index: 1;
}

/* Overlay container */
#overlay {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 900;
  opacity: 0;
  transition: opacity 0.8s ease-in;
}

#overlay.show {
  display: block;
  opacity: 1;
}

/* Earthed background overlay */
#overlay img.overlay-bg {
  position: absolute;
  top: -40px;
  left: -70px;
  width: 1400px;
  height: auto;
  object-fit: cover;
  display: block;
  z-index: 1;
}

/* Snail and bee animation */
.snailbee {
  position: absolute;
  top: 100px;  /* adjust starting vertical position */
  left: 235px;  /* adjust starting horizontal position */
  width: 600px; /* adjust size */
  height: auto;
  z-index: 3;  /* above overlay, below white buttons */
  animation: moveSnailBee 4s infinite alternate ease-in-out;
}

@keyframes moveSnailBee {
  0%   { transform: translate(0px, 0px) rotate(0deg); }
  25%  { transform: translate(50px, -20px) rotate(10deg); }
  50%  { transform: translate(100px, 0px) rotate(-10deg); }
  75%  { transform: translate(30px, 10px) rotate(5deg); }
  100% { transform: translate(0px, 0px) rotate(0deg); }
}

/* White logo overlay */
#overlay .logo-white {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  z-index: 2;
}

/* White buttons overlay */
#overlay a.white-button {
  position: absolute;
  display: block;
  z-index: 2;
}

#overlay a.white-button img {
  display: block;
  width: auto;
  height: auto;
}
/* ---------------------------- Media Queries for Responsiveness ---------------------------- */
@media only screen and (max-width: 768px) {

  /* ================== General Adjustments for Mobile ================== */
  body {
    margin: 0;
    padding: 0;
    background: black;
  }

  .container {
    width: 100%;        /* Container takes full width of the screen on mobile */
    max-width: none;    /* Remove max-width for small screens */
    margin: 0;
    background: black;
  }

  .background, .flicker, .logo {
    display: block;
    width: 100%;        /* Ensure background and logo images scale to screen width */
    height: auto;
  }
/* ---------------------------- General Background Style ---------------------------- */
body {
  margin: 0;
  padding: 0;
  background: black;
  background-image: url('images/your-background-image.jpg'); /* Add your image */
  background-size: cover; /* Ensures the image covers the entire viewport */
  background-repeat: no-repeat;
  background-position: center top; /* Position the background image from the top */
  background-attachment: fixed; /* Keeps background in place while scrolling (optional) */
}

/* ---------------------------- Media Queries for Responsiveness ---------------------------- */
@media only screen and (max-width: 768px) {

  /* ================== General Adjustments for Mobile ================== */
  body {
    margin: 0;
    padding: 0;
    background: black;
    background-image: url('images/your-background-image.jpg'); /* Add your image */
    background-size: auto 200%; /* This will extend the background vertically */
    background-position: center top; /* Keep the top of the background image aligned to the viewport */
    background-repeat: no-repeat;
    background-attachment: fixed; /* Keeps background in place while scrolling */
  }

  .container {
    width: 100%;        /* Container takes full width of the screen on mobile */
    max-width: none;    /* Remove max-width for small screens */
    margin: 0;
    background: black;
    height: 100vh;      /* Ensure the container takes full height of the screen */
    overflow: hidden;   /* Hide anything that extends beyond the container (background image) */
  }

  .background, .flicker, .logo {
    display: block;
    width: 100%;        /* Ensure background and logo images scale to screen width */
    height: auto;
  }

  /* ================== Original Buttons (Unclicked state) - Mobile Adjustments ================== */
  .original-button {
    width: 40%;          /* Button width is smaller on mobile for a compact look */
    top: 50%;            /* Center the buttons vertically on the screen */
    left: 50%;           /* Center the buttons horizontally */
    transform: translateX(-50%);  /* Ensures buttons are centered */
    margin-bottom: 30px; /* Add space between buttons for better separation */
    transition: top 0.3s, transform 0.3s;  /* Smooth transition for positioning */
  }

  .original-button img {
    width: 100%;         /* Make button images fill their containers */
    height: auto;        /* Maintain aspect ratio of the button images */
    object-fit: contain; /* Ensure images fit within their container without distortion */
  }

  /* ================== Specific Button Adjustments (Unclicked) ================== */
  #about-button {
    top: 40%;   /* Adjust vertical position for the About button */
  }

  #music-button {
    top: 45%;   /* Adjust vertical position for the Music button */
  }

  #blog-button {
    top: 50%;   /* Adjust vertical position for the Blog button */
  }

  #gallery-button {
    top: 55%;   /* Adjust vertical position for the Gallery button */
  }

  #contact-button {
    top: 60%;   /* Adjust vertical position for the Contact button */
  }

  /* ================== Snail and Bee Animation (Mobile Adjustments) ================== */
  .snailbee {
    top: 100px;  /* Adjust vertical position of the snail and bee animation */
    left: 25%;   /* Position animation towards the left */
    width: 350px; /* Reduce size of animation on mobile */
  }

  /* ================== Overlay Background and White Buttons ================== */
  #overlay {
    /* Overlay container adjustments */
  }

  #overlay img.overlay-bg {
    width: 100%;  /* Ensure overlay background image fits full screen width */
    height: auto; /* Maintain aspect ratio for overlay background */
  }

  /* White Buttons (Overlay - Unclicked State) */
  #overlay a.white-button {
    position: absolute; /* Position each white button absolutely within the overlay */
    display: block;     /* Make each button behave like a block-level element */
    z-index: 2;         /* Ensure buttons are above the overlay background */
  }

  #overlay a.white-button img {
    display: block;     /* Ensure button images behave like block-level elements */
    width: auto;        /* Adjust width dynamically */
    height: auto;       /* Maintain aspect ratio of the images */
    max-width: 100%;     /* Ensure button images don’t exceed container width */
  }

  /* Specific Adjustments for Each White Button */
  #overlay #white-about-button {
    top: 358px;  /* Position the "About" white button vertically */
    left: 25%;   /* Position horizontally */
  }

  #overlay #white-music-button {
    top: 363px;  /* Position the "Music" white button vertically */
    left: 35%;   /* Position horizontally */
  }

  #overlay #white-blog-button {
    top: 360px;  /* Position the "Blog" white button vertically */
    left: 57%;   /* Position horizontally */
  }

  #overlay #white-gallery-button {
    top: 363px;  /* Position the "Gallery" white button vertically */
    left: 46%;   /* Position horizontally */
  }

  #overlay #white-contact-button {
    top: 365px;  /* Position the "Contact" white button vertically */
    left: 67%;   /* Position horizontally */
  }

  /* ================== Purple ON/OFF Button (Unclicked State) ================== */
  .switch-button {
    position: absolute;           /* Position the button absolutely on the screen */
    top: 475px;                   /* Vertical position of the button */
    left: 25%;                    /* Horizontal position (centered) */
    transform: translateX(-50%);  /* Center horizontally */
    width: 100px;                 /* Width of the button */
    height: 50px;                 /* Height of the button */
    background-color: purple;    /* Purple background color */
    border: 2px solid #fff;      /* White border */
    border-radius: 25px;         /* Rounded corners */
    cursor: pointer;             /* Makes it appear clickable */
    color: white;                /* Text color (if any) inside the button */
    font-weight: bold;           /* Bold text */
    font-family: sans-serif;     /* Use sans-serif font */
    text-align: center;          /* Center text inside the button */
    line-height: 50px;           /* Vertically center text inside button */
    text-decoration: none;       /* Remove text underline (if it's a link) */
    transition: background 0.3s, transform 0.2s; /* Smooth transition for background and scaling */
    z-index: 1001;               /* Ensure button is above other content */
  }

  /* Hover Effect for Purple Button (Unclicked State) */
  .switch-button:hover {
    background-color: #a64ca6;   /* Lighter purple when hovered */
    transform: scale(1.05);       /* Slightly enlarge the button on hover */
  }

  /* ================== Purple ON/OFF Button (Clicked State) ================== */
  .switch-button.clicked {
    background-color: #8e3fa7;    /* Darker purple when clicked */
    transform: scale(1.1);         /* Slightly enlarge the button when clicked */
  }

  /* Active State for the Purple Button */
  .switch-button:active {
    background-color: #7b2b8e;     /* Even darker purple when pressed */
    transform: scale(1.05);         /* Slightly shrink back when actively pressed */
  }

  /* ================== Logo Adjustments for Mobile ================== */
  .logo {
    width: 400px;  /* Reduce logo size on mobile */
    top: 100px;    /* Adjust vertical position for mobile */
    left: 50%;     /* Center logo horizontally */
    transform: translateX(-50%);  /* Center logo horizontally */
  }

  #overlay .logo-white {
    width: 400px;  /* Adjust white logo size for mobile */
  }

  /* ================== Button Spacing and Vertical Adjustments ================== */
  .original-button {
    margin-bottom: 30px; /* Add more space between buttons */
  }
}
</style>
</head>
<body>
<div class="container">
  <!-- Stationary background flowers -->
  <img src="images/backgnoflickerflow.png" alt="Background Flowers" class="background">

  <!-- Flickering flowers -->
  <img src="images/flickerbacklights.png" alt="Flickering Flowers" class="flicker">

  <!-- Original logo -->
  <img src="images/honeyspacelogo.png" alt="Honey Space Logo" class="logo">

  <!-- Original buttons -->
  <a href="about.html" class="original-button" style="top: 345px; left: 25%;">
    <img src="images/abouthoney.png" style="width: 85px; height:auto;">
  </a>
  <a href="music.html" class="original-button" style="top: 317px; left: 35%;">
    <img src="images/musicbutton.png" style="width: 133px; height:auto;">
  </a>
  <a href="blog.html" class="original-button" style="top: 354px; left: 57%;">
    <img src="images/blogbutton.png" style="width: 81px; height:auto;">
  </a>
  <a href="gallery.html" class="original-button" style="top: 363px; left: 46%;">
    <img src="images/gallerybutton.png" style="width: 90px; height:auto;">
  </a>
  <a href="contact.html" class="original-button" style="top: 348px; left: 67%;">
    <img src="images/contactbutton.png" style="width: 80px; height:auto;">
  </a>

  <!-- Purple ON/OFF button -->
  <a href="#" class="switch-button" onclick="toggleOverlay(); return false;">ON / OFF</a>

  <!-- Overlay -->
  <div id="overlay">
    <!-- Earthed background -->
    <img src="images/earthedbackground.png" alt="Earthed Background" class="overlay-bg">

    <!-- Snail and bee image -->
    <img src="images/snailandbee.png" alt="Snail and Bee" class="snailbee">

    <!-- White logo -->
    <img src="images/honeyspacelogo.png" alt="White Logo" class="logo-white">

    <!-- White buttons -->
    <a href="about.html" class="white-button" style="top: 358px; left: 25%;">
      <img src="images/whiteaboutbutton.png" style="width: 79px; height:auto;">
    </a>
    <a href="music.html" class="white-button" style="top: 363px; left: 35%;">
      <img src="images/whitemusicbutton.png" style="width: 90px; height:auto;">
    </a>
    <a href="blog.html" class="white-button" style="top: 360px; left: 57%;">
      <img src="images/whiteblogbutton.png" style="width: 69px; height:auto;">
    </a>
    <a href="gallery.html" class="white-button" style="top: 363px; left: 46%;">
      <img src="images/whitegallerybutton.png" style="width: 90px; height:auto;">
    </a>
    <a href="contact.html" class="white-button" style="top: 365px; left: 67%;">
      <img src="images/whitecontactbutton.png" style="width: 80px; height:auto;">
    </a>
  </div>
</div>

<script>
function toggleOverlay() {
  const overlay = document.getElementById('overlay');
  overlay.classList.toggle('show');
}
</script>
</body>
</html>
