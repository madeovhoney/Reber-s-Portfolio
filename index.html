<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Space</title>

<style>

/* =======================================================
   1. GLOBAL
   ======================================================= */
body {
  margin: 0;
  padding: 0;
  background: black;
  overflow-x: hidden;
}

.container {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
}

/* =======================================================
   2. BACKGROUND
   ======================================================= */
.background {
  width: 100%;        /* EDIT background size */
  height: auto;
  display: block;
  z-index: 1;
}

/* =======================================================
   3. EART HED FADE IMAGE (HIDDEN BY DEFAULT)
   ======================================================= */
.earthed-overlay {
  position: absolute;
  top: 0;             /* EDIT vertical */
  left: 0;            /* EDIT horizontal */
  width: 100%;        /* EDIT size */
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.2s ease-in-out;
  z-index: 2;
}

/* =======================================================
   4. FLICKERS
   ======================================================= */
.flicker-layer {
  position: absolute;
  z-index: 3;
  pointer-events: none;
  filter: brightness(1);
  transition: filter 0.05s ease-in-out;
}

.flash {
  filter: brightness(3);
}

/* =======================================================
   5. LOGO SYSTEM
   ======================================================= */
.logo-group {
  position: absolute;
  top: 125px;           /* EDIT vertical */
  left: 50%;            /* EDIT horizontal */
  transform: translateX(-50%);
  width: 600px;         /* EDIT size */
  z-index: 6;
}

.logo-group img {
  width: 100%;
  height: auto;
  display: block;
}

/* FORCE overlay logo hidden by default */
.overlay-logo {
  display: none !important;
}

/* =======================================================
   6. NAV BUTTON SYSTEM
   ======================================================= */
.nav-group {
  position: absolute;
  z-index: 6;
}

.nav-group img {
  display: block;
  height: auto;
}

/* FORCE overlay button images hidden */
.overlay-version {
  display: none !important;
}

/* =======================================================
   7. PURPLE BUTTON
   ======================================================= */
.switch-button {
  position: absolute;
  top: 500px;          /* EDIT vertical */
  left: 50%;           /* EDIT horizontal */
  transform: translateX(-50%);
  width: 75px;         /* EDIT size */
  z-index: 10;
  cursor: pointer;
}

.switch-button img {
  width: 100%;
  height: auto;
}

/* =======================================================
   8. ACTIVE STATE (ONLY TRIGGERED BY BUTTON)
   ======================================================= */
.container.overlay-active .earthed-overlay {
  opacity: 1;
}

.container.overlay-active .normal-logo {
  display: none !important;
}

.container.overlay-active .overlay-logo {
  display: block !important;
}

.container.overlay-active .normal-version {
  display: none !important;
}

.container.overlay-active .overlay-version {
  display: block !important;
}

</style>
</head>

<body>

<div class="container" id="mainContainer">

  <!-- ================= BACKGROUND ================= -->
  <img src="images/BlackUnearthBackground.png"
       class="background"
       alt="Unearthed Background">

  <!-- ================= EART HED FADE ================= -->
  <img src="images/Earthedoverlayfadein.png"
       class="earthed-overlay"
       alt="Earthed Fade Overlay">

  <!-- ================= FLICKERS ================= -->
  <img src="images/Flowersandboltflicker.png"
       class="flicker-layer"
       style="width:1275px; top:-150px; left:-89px;">

  <img src="images/Boltandheartflicker.png"
       class="flicker-layer"
       style="width:189px; top:825px; left:500px;">

  <img src="images/Boltandstarflicker.png"
       class="flicker-layer"
       style="width:675px; top:250px; left:25px;">

  <img src="images/Starsflicker.png"
       class="flicker-layer"
       style="width:100px; top:85px; left:575px;">

  <img src="images/starandalienflicker.png"
       class="flicker-layer"
       style="width:650px; top:825px; left:10px;">

  <img src="images/flowersflicker.png"
       class="flicker-layer"
       style="width:575px; top:7px; left:480px;">

  <!-- ================= LOGO GROUP ================= -->
  <div class="logo-group">

    <img src="images/Logoandbeelight.png"
         class="normal-logo"
         alt="Main Logo">

    <img src="images/Overlaylogo.png"
         class="overlay-logo"
         alt="Overlay Logo">

  </div>

  <!-- ================= NAV BUTTONS ================= -->

  <a href="about.html" class="nav-group" style="top:345px; left:25%;">
    <img src="images/Aboutlinkclick.png" class="normal-version" style="width:85px;">
    <img src="images/Overlayaboutlink.png" class="overlay-version" style="width:85px;">
  </a>

  <a href="music.html" class="nav-group" style="top:350px; left:57%;">
    <img src="images/Musiclinkclick.png" class="normal-version" style="width:86px;">
    <img src="images/Overlaymusiclink.png" class="overlay-version" style="width:86px;">
  </a>

  <a href="blog.html" class="nav-group" style="top:360px; left:46%;">
    <img src="images/bloglinkclick.png" class="normal-version" style="width:81px;">
    <img src="images/Overlaybloglink.png" class="overlay-version" style="width:81px;">
  </a>

  <a href="gallery.html" class="nav-group" style="top:369px; left:35%;">
    <img src="images/Gallerylinkclick.png" class="normal-version" style="width:90px;">
    <img src="images/Overlaygallerylink.png" class="overlay-version" style="width:90px;">
  </a>

  <a href="contact.html" class="nav-group" style="top:360px; left:67%;">
    <img src="images/contactlinkclick.png" class="normal-version" style="width:80px;">
    <img src="images/Overlaycontactlink.png" class="overlay-version" style="width:80px;">
  </a>

  <!-- ================= PURPLE BUTTON ================= -->
  <div id="toggleOverlay" class="switch-button">
    <img src="images/purplebutton.png" alt="Toggle Overlay">
  </div>

</div>

<script>

/* ================= FLICKER SYSTEM ================= */
function flashFlicker(img) {
  function cycle() {
    const flashes = Math.floor(Math.random()*3)+1;
    let count = 0;

    function flash() {
      img.classList.add('flash');
      setTimeout(() => {
        img.classList.remove('flash');
        count++;
        if(count < flashes) {
          setTimeout(flash, 70 + Math.random()*80);
        } else {
          setTimeout(cycle, 10000 + Math.random()*5000);
        }
      }, 70);
    }
    flash();
  }
  setTimeout(cycle, Math.random()*8000);
}

document.querySelectorAll('.flicker-layer')
  .forEach(flashFlicker);

/* ================= OVERLAY TOGGLE ================= */
const container = document.getElementById('mainContainer');
document.getElementById('toggleOverlay')
  .addEventListener('click', () => {
    container.classList.toggle('overlay-active');
  });

</script>

</body>
</html>
