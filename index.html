<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Space Fast Flicker Animation</title>

<style>
/* =======================================================
   1. GLOBAL STYLING
   ======================================================= */
body {
  margin: 0;
  padding: 0;
  background: black;
  overflow-x: hidden;
}

.container {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
  background: black;
}

/* =======================================================
   2. MAIN BACKGROUND IMAGE
   ======================================================= */
.background {
  display: block;
  width: 100%;
  height: auto;
  z-index: 1;
}

/* =======================================================
   3. FLICKER IMAGES
   ======================================================= */
.flicker-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: auto;
  height: auto;
  opacity: 0; /* Start hidden */
  z-index: 2;
  pointer-events: none;
}

/* Quick flash animation */
@keyframes flash {
  0% { opacity: 0; }
  10% { opacity: 1; }
  20% { opacity: 0; }
  30% { opacity: 1; }
  40% { opacity: 0; }
  100% { opacity: 0; }
}

.flash {
  animation-name: flash;
  animation-duration: 0.5s; /* Very short flash */
  animation-timing-function: ease-in-out;
}

/* =======================================================
   4. MAIN LOGO
   ======================================================= */
.logo {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  z-index: 5;
}

/* =======================================================
   5. NAVIGATION BUTTONS
   ======================================================= */
.original-button {
  position: absolute;
  display: block;
  z-index: 5;
}

.original-button img {
  display: block;
  height: auto;
}

/* =======================================================
   6. PURPLE TOGGLE BUTTON
   ======================================================= */
.switch-button {
  position: absolute;
  top: 475px;
  left: 25%;
  transform: translateX(-50%);
  width: 120px;
  z-index: 1001;
  cursor: pointer;
}

.switch-button img {
  width: 100%;
  height: auto;
  display: block;
}

/* =======================================================
   7. MOBILE RESPONSIVENESS
   ======================================================= */
@media only screen and (max-width: 768px) {
  .logo { width: 400px; top: 100px; }
  .original-button { width: 40%; left: 50%; transform: translateX(-50%); }
  .switch-button { top: 420px; width: 100px; }
}
</style>
</head>

<body>

<div class="container">

  <!-- MAIN BACKGROUND -->
  <img id="background" class="background" alt="Background">

  <!-- FLICKER IMAGES -->
  <img id="flicker1" class="flicker-layer" style="width:1200px; top:-125px; left:-25px;">
  <img id="flicker2" class="flicker-layer" style="width:300px; top:800px; left:350px;">
  <img id="flicker3" class="flicker-layer" style="width:675px; top:250px; left:25px;">
  <img id="flicker4" class="flicker-layer" style="width:100px; top:85px; left:575px;">
  <img id="flicker5" class="flicker-layer" style="width:750px; top:800px; left:50px;">
  <img id="flicker6" class="flicker-layer" style="width:575px; top:7px; left:480px;">

  <!-- MAIN LOGO -->
  <img src="images/Logoandbeelight.png" alt="Honey Space Logo" class="logo">

  <!-- NAVIGATION BUTTONS -->
  <a href="about.html" class="original-button" style="top:345px; left:25%;">
    <img src="images/Aboutlinkclick.png" style="width:85px;">
  </a>
  <a href="music.html" class="original-button" style="top:317px; left:35%;">
    <img src="images/Musiclinkclick.png" style="width:133px;">
  </a>
  <a href="blog.html" class="original-button" style="top:354px; left:57%;">
    <img src="images/bloglinkclick.png" style="width:81px;">
  </a>
  <a href="gallery.html" class="original-button" style="top:363px; left:46%;">
    <img src="images/Gallerylinkclick.png" style="width:90px;">
  </a>
  <a href="contact.html" class="original-button" style="top:348px; left:67%;">
    <img src="images/contactlinkclick.png" style="width:80px;">
  </a>

  <!-- PURPLE TOGGLE BUTTON -->
  <a href="#" class="switch-button">
    <img src="images/purplebutton.png" alt="Toggle Overlay">
  </a>

</div>

<!-- =======================================================
     JAVASCRIPT: FAST INDEPENDENT FLICKERS WITH RANDOM INTERVALS
     ======================================================= -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const timestamp = new Date().getTime();

  // Background with timestamp for auto-refresh
  document.getElementById('background').src = 'images/BlackUnearthBackground.png?t=' + timestamp;

  // Flicker images map
  const flickerMap = {
    'flicker1': 'images/Flowersandboltflicker.png',
    'flicker2': 'images/Boltandheartflicker.png',
    'flicker3': 'images/Boltandstarflicker.png',
    'flicker4': 'images/Starsflicker.png',
    'flicker5': 'images/starandalienflicker.png',
    'flicker6': 'images/flowersflicker.png'
  };

  // Assign src to each flicker
  Object.keys(flickerMap).forEach(id => {
    const img = document.getElementById(id);
    if(img) img.src = flickerMap[id] + '?t=' + timestamp;
  });

  // Function to flash a flicker image quickly, then schedule next flash
  function flashFlicker(img) {
    const flashCount = Math.floor(Math.random() * 3) + 1; // 1-3 quick flashes
    let flashes = 0;

    function doFlash() {
      img.classList.add('flash');
      setTimeout(() => {
        img.classList.remove('flash');
        flashes++;
        if(flashes < flashCount) {
          setTimeout(doFlash, 100 + Math.random()*200); // very short delay between flashes
        } else {
          // Schedule next burst after ~10-30 seconds random
          const nextTime = 10000 + Math.random() * 20000;
          setTimeout(doFlash, nextTime);
        }
      }, 100); // duration of each flash
    }

    doFlash();
  }

  // Initialize all flickers
  Object.keys(flickerMap).forEach(id => {
    const img = document.getElementById(id);
    if(img) flashFlicker(img);
  });
});
</script>

</body>
</html>
