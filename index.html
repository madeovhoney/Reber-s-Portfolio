<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Space Flicker Animation</title>

<style>
/* =======================================================
   1. GLOBAL STYLING
   ======================================================= */
body {
  margin: 0;
  padding: 0;
  background: black;       /* Base background color */
  overflow-x: hidden;      /* Prevent horizontal scroll */
}

.container {
  position: relative;      /* Allows absolute positioning of child elements */
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
  background: black;
}

/* =======================================================
   2. MAIN BACKGROUND IMAGE
   ======================================================= */
.background {
  display: block;
  width: 100%;             /* Full width of viewport */
  height: auto;            /* Maintain aspect ratio */
  z-index: 1;              /* Base layer */
}

/* =======================================================
   3. FLICKER IMAGES (OVERLAY)
   ======================================================= */
/* General class for all flicker images */
.flicker-layer {
  position: absolute;      /* Overlay on top of background */
  top: 0;                  /* Default top (can override individually) */
  left: 0;                 /* Default left (can override individually) */
  width: auto;             /* Default size (override individually) */
  height: auto;            /* Default size (override individually) */
  opacity: 1;              /* Default visibility */
  z-index: 2;              /* Above background but below logo/buttons */
  pointer-events: none;    /* Allows clicks to pass through to buttons */
  animation-name: flickerAnimation;
  animation-duration: 5s;  /* Default flicker cycle (can override individually) */
  animation-iteration-count: infinite;
  animation-timing-function: ease-in-out;
}

/* Flicker keyframes (fade in/out effect) */
@keyframes flickerAnimation {
  0%, 20%, 40%, 60%, 80%, 100% { opacity: 1; }
  10%, 30%, 50%, 70%, 90% { opacity: 0.3; }
}

/* =======================================================
   4. MAIN LOGO
   ======================================================= */
.logo {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  z-index: 5;
}

/* =======================================================
   5. NAVIGATION BUTTONS
   ======================================================= */
.original-button {
  position: absolute;
  display: block;
  z-index: 5;
}

.original-button img {
  display: block;
  height: auto;
}

/* =======================================================
   6. PURPLE TOGGLE BUTTON
   ======================================================= */
.switch-button {
  position: absolute;
  top: 475px;
  left: 25%;
  transform: translateX(-50%);
  width: 120px;
  z-index: 1001;
  cursor: pointer;
}

.switch-button img {
  width: 100%;
  height: auto;
  display: block;
}

/* =======================================================
   7. MOBILE RESPONSIVENESS
   ======================================================= */
@media only screen and (max-width: 768px) {
  .logo {
    width: 400px;
    top: 100px;
  }

  .original-button {
    width: 40%;
    left: 50%;
    transform: translateX(-50%);
  }

  .switch-button {
    top: 420px;
    width: 100px;
  }
}

</style>
</head>

<body>

<div class="container">

  <!-- =====================================================
       MAIN BACKGROUND
       ===================================================== -->
  <img src="images/BlackUnearthBackground.png" alt="Background" class="background">

  <!-- =====================================================
       FLICKER IMAGES
       Each flicker has its own size, position, and animation delay
       ===================================================== -->

  <!-- Flicker 1: Flowers and Bolt -->
  <img src="images/Flowersandboltflicker.png" 
       class="flicker-layer"
       style="
         width: 1200px;        /* Set individual width */
         top: -25px;             /* Set vertical position */
         left: -3px;            /* Set horizontal position */
         animation-delay: 0s;  /* Stagger start of animation */
       ">

  <!-- Flicker 2: Bolt and Heart -->
  <img src="images/Boltandheartflicker.png" 
       class="flicker-layer"
       style="
         width: 200px;
         top: 50px;
         left: 200px;
         animation-delay: 1.5s;
       ">

  <!-- Flicker 3: Bolt and Star -->
  <img src="images/Boltandstarflicker.png" 
       class="flicker-layer"
       style="
         width: 300px;
         top: 700px;
         left: 250px;
         animation-delay: 3s;
       ">

  <!-- Flicker 4: Stars -->
  <img src="images/Starsflicker.png" 
       class="flicker-layer"
       style="
         width: 150px;
         top: 125px;
         left: 450px;
         animation-delay: 4.5s;
       ">

  <!-- Flicker 5: Star and Alien -->
  <img src="images/starandalienflicker.png" 
       class="flicker-layer"
       style="
         width: 850px;
         top: 80px;
         left: 300px;
         animation-delay: 6s;
       ">

  <!-- Flicker 6: Flowers -->
  <img src="images/flowersflicker.png" 
       class="flicker-layer"
       style="
         width: 200px;
         top: 20px;
         left: 100px;
         animation-delay: 7.5s;
       ">

  <!-- =====================================================
       MAIN LOGO
       ===================================================== -->
  <img src="images/Logoandbeelight.png" alt="Honey Space Logo" class="logo">

  <!-- =====================================================
       NAVIGATION BUTTONS
       ===================================================== -->
  <a href="about.html" class="original-button" style="top: 345px; left: 25%;">
    <img src="images/Aboutlinkclick.png" style="width: 85px;">
  </a>

  <a href="music.html" class="original-button" style="top: 317px; left: 35%;">
    <img src="images/Musiclinkclick.png" style="width: 133px;">
  </a>

  <a href="blog.html" class="original-button" style="top: 354px; left: 57%;">
    <img src="images/bloglinkclick.png" style="width: 81px;">
  </a>

  <a href="gallery.html" class="original-button" style="top: 363px; left: 46%;">
    <img src="images/Gallerylinkclick.png" style="width: 90px;">
  </a>

  <a href="contact.html" class="original-button" style="top: 348px; left: 67%;">
    <img src="images/contactlinkclick.png" style="width: 80px;">
  </a>

  <!-- =====================================================
       PURPLE TOGGLE BUTTON
       ===================================================== -->
  <a href="#" class="switch-button">
    <img src="images/purplebutton.png" alt="Toggle Overlay">
  </a>

</div>

</body>
</html>
