<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Honey Space</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      background: black;
    }

    .background, .flicker, .logo {
      display: block;
      width: 100%;
      height: auto;
    }

    .flicker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      transform: translateX(-34px) translateY(69px);
      animation: flickerAnimation 7s infinite;
    }

    @keyframes flickerAnimation {
      0%, 15%, 20%, 25%, 50%, 55%, 100% { opacity: 1; }
      16%, 18%, 22%, 24%, 51%, 54% { opacity: 0.3; }
    }

    .logo {
      position: absolute;
      top: 125px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
    }

    /* Purple On/Off switch button */
    .switch-button {
      position: absolute;
      top: 475px;
      left: 25%;
      transform: translateX(-50%);
      width: 100px;
      height: 50px;
      background-color: purple;
      border: 2px solid #fff;
      border-radius: 25px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      font-family: sans-serif;
      text-align: center;
      line-height: 50px;
      text-decoration: none;
      transition: background 0.3s, transform 0.2s;
    }

    .switch-button:hover {
      background-color: #a64ca6;
      transform: scale(1.05);
    }

    a {
      display: block;
      position: absolute; /* allow independent positioning */
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Stationary background flowers -->
    <img src="images/backgnoflickerflow.png" alt="Background Flowers" class="background">
    
    <!-- Flickering flowers -->
    <img src="images/flickerbacklights.png" alt="Flickering Flowers" class="flicker">

    <!-- Logo -->
    <img src="images/honeyspacelogo.png" alt="Honey Space Logo" class="logo">

    <!-- Buttons / clickable links with independent sizes and positions -->
    <a href="about.html" style="top: 339px; left: 25%;">
      <img src="images/abouthoney.png" alt="About Honey" style="width: 80px; height: auto;">
    </a>

    <a href="music.html" style="top: 315px; left: 35%;">
      <img src="images/musicbutton.png" alt="Music" style="width: 127px; height: auto;">
    </a>

    <a href="blog.html" style="top: 349px; left: 54%;">
      <img src="images/blogbutton.png" alt="Blog" style="width: 85px; height: auto;">
    </a>

    <a href="gallery.html" style="top: 360px; left: 45%;">
      <img src="images/gallerybutton.png" alt="Gallery" style="width: 90px; height: auto;">
    </a>

    <a href="contact.html" style="top: 348px; left: 64%;">
      <img src="images/contactbutton.png" alt="Contact" style="width: 78px; height: auto;">
    </a>

    <!-- Purple On/Off switch -->
    <a href="newpage.html" class="switch-button">ON / OFF</a>
  </div>
</body>
</html>
