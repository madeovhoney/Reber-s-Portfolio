<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Space</title>

<style>

/* =======================================================
   1. GLOBAL STYLING
   ======================================================= */
body {
  margin: 0;
  padding: 0;
  background: black;
  overflow-x: hidden;
}

.container {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
}

/* =======================================================
   2. MAIN BACKGROUND (UNEART HED)
   ======================================================= */
.background {
  width: 100%;        /* EDIT background size */
  height: auto;
  display: block;
  z-index: 1;
}

/* =======================================================
   3. EART HED FADE OVERLAY
   ======================================================= */
.earthed-overlay {
  position: absolute;
  top: 0;             /* EDIT overlay vertical position */
  left: 0;            /* EDIT overlay horizontal position */
  width: 100%;        /* EDIT overlay size */
  opacity: 0;
  transition: opacity 1.2s ease-in-out;
  pointer-events: none;
  z-index: 2;
}

.overlay-active .earthed-overlay {
  opacity: 1;
}

/* =======================================================
   4. FLICKER IMAGES (ALL EDITABLE)
   ======================================================= */
.flicker-layer {
  position: absolute;
  opacity: 1;
  z-index: 3;
  pointer-events: none;
  filter: brightness(1);
  transition: filter 0.05s ease-in-out;
}

.flash {
  filter: brightness(3);
}

/* =======================================================
   5. LOGO SYSTEM (SWAP CLEANLY)
   ======================================================= */
.logo-group {
  position: absolute;
  top: 125px;           /* EDIT logo vertical position */
  left: 50%;            /* EDIT logo horizontal position */
  transform: translateX(-50%);
  width: 600px;         /* EDIT logo size */
  z-index: 6;
}

.logo-group img {
  width: 100%;
  height: auto;
  display: block;
}

/* Hide overlay logo by default */
.overlay-logo {
  display: none;
}

/* Swap when active */
.overlay-active .normal-logo {
  display: none;
}

.overlay-active .overlay-logo {
  display: block;
}

/* =======================================================
   6. NAV BUTTON SYSTEM (SWAP CLEANLY)
   ======================================================= */
.nav-group {
  position: absolute;
  z-index: 6;
}

.nav-group img {
  display: block;
  height: auto;
}

/* Hide overlay buttons by default */
.overlay-version {
  display: none;
}

/* Swap button versions */
.overlay-active .normal-version {
  display: none;
}

.overlay-active .overlay-version {
  display: block;
}

/* =======================================================
   7. PURPLE BUTTON (NEVER MOVES)
   ======================================================= */
.switch-button {
  position: absolute;
  top: 500px;           /* EDIT button vertical position */
  left: 50%;            /* EDIT button horizontal position */
  transform: translateX(-50%);
  width: 75px;          /* EDIT button size */
  z-index: 10;
  cursor: pointer;
}

.switch-button img {
  width: 100%;
  height: auto;
}

</style>
</head>

<body>

<div class="container" id="mainContainer">

  <!-- ================= BACKGROUND ================= -->
  <img src="images/BlackUnearthBackground.png"
       class="background"
       alt="Unearthed Background">

  <!-- ================= EART HED FADE IMAGE ================= -->
  <img src="images/Earthedoverlayfadein.png"
       class="earthed-overlay"
       alt="Earthed Fade Overlay">

  <!-- ================= FLICKER IMAGES ================= -->

  <!-- EDIT width / top / left individually -->
  <img src="images/Flowersandboltflicker.png"
       class="flicker-layer"
       style="width:1275px; top:-150px; left:-89px;">

  <img src="images/Boltandheartflicker.png"
       class="flicker-layer"
       style="width:189px; top:825px; left:500px;">

  <img src="images/Boltandstarflicker.png"
       class="flicker-layer"
       style="width:675px; top:250px; left:25px;">

  <img src="images/Starsflicker.png"
       class="flicker-layer"
       style="width:100px; top:85px; left:575px;">

  <img src="images/starandalienflicker.png"
       class="flicker-layer"
       style="width:650px; top:825px; left:10px;">

  <img src="images/flowersflicker.png"
       class="flicker-layer"
       style="width:575px; top:7px; left:480px;">

  <!-- ================= LOGO (SWAPS) ================= -->
  <div class="logo-group">

    <!-- Normal Logo -->
    <img src="images/Logoandbeelight.png"
         class="normal-logo"
         alt="Main Logo">

    <!-- Overlay Logo -->
    <img src="images/Overlaylogo.png"
         class="overlay-logo"
         alt="Overlay Logo">

  </div>

  <!-- ================= NAV BUTTONS ================= -->

  <!-- About -->
  <a href="about.html" class="nav-group"
     style="top:345px; left:25%;">
    <img src="images/Aboutlinkclick.png"
         class="normal-version"
         style="width:85px;">
    <img src="images/Overlayaboutlink.png"
         class="overlay-version"
         style="width:85px;">
  </a>

  <!-- Music -->
  <a href="music.html" class="nav-group"
     style="top:350px; left:57%;">
    <img src="images/Musiclinkclick.png"
         class="normal-version"
         style="width:86px;">
    <img src="images/Overlaymusiclink.png"
         class="overlay-version"
         style="width:86px;">
  </a>

  <!-- Blog -->
  <a href="blog.html" class="nav-group"
     style="top:360px; left:46%;">
    <img src="images/bloglinkclick.png"
         class="normal-version"
         style="width:81px;">
    <img src="images/Overlaybloglink.png"
         class="overlay-version"
         style="width:81px;">
  </a>

  <!-- Gallery -->
  <a href="gallery.html" class="nav-group"
     style="top:369px; left:35%;">
    <img src="images/Gallerylinkclick.png"
         class="normal-version"
         style="width:90px;">
    <img src="images/Overlaygallerylink.png"
         class="overlay-version"
         style="width:90px;">
  </a>

  <!-- Contact -->
  <a href="contact.html" class="nav-group"
     style="top:360px; left:67%;">
    <img src="images/contactlinkclick.png"
         class="normal-version"
         style="width:80px;">
    <img src="images/Overlaycontactlink.png"
         class="overlay-version"
         style="width:80px;">
  </a>

  <!-- ================= PURPLE BUTTON ================= -->
  <div id="toggleOverlay" class="switch-button">
    <img src="images/purplebutton.png" alt="Toggle Overlay">
  </div>

</div>

<script>

/* =======================================================
   FLICKER SYSTEM
   ======================================================= */
function flashFlicker(img) {
  function cycle() {
    const flashes = Math.floor(Math.random()*3)+1;
    let count = 0;

    function flash() {
      img.classList.add('flash');
      setTimeout(() => {
        img.classList.remove('flash');
        count++;
        if(count < flashes) {
          setTimeout(flash, 70 + Math.random()*80);
        } else {
          setTimeout(cycle, 10000 + Math.random()*5000);
        }
      }, 70);
    }

    flash();
  }

  setTimeout(cycle, Math.random()*8000);
}

document.querySelectorAll('.flicker-layer')
  .forEach(flashFlicker);

/* =======================================================
   OVERLAY TOGGLE SYSTEM
   ======================================================= */
const container = document.getElementById('mainContainer');
const toggle = document.getElementById('toggleOverlay');

toggle.addEventListener('click', () => {
  container.classList.toggle('overlay-active');
});

</script>

</body>
</html>
