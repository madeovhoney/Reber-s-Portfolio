<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Space Flicker Animation</title>

<style>
/* =======================================================
   1. GLOBAL STYLING
   ======================================================= */
body {
  margin: 0;
  padding: 0;
  background: black;
  overflow-x: hidden;
}

.container {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
  background: black;
}

/* =======================================================
   2. MAIN BACKGROUND IMAGE
   ======================================================= */
.background {
  display: block;
  width: 100%;             /* Resize background by changing width */
  height: auto;
  z-index: 1;
}

/* =======================================================
   3. FLICKER IMAGES (ALL)
   ======================================================= */
.flicker-layer {
  position: absolute;       /* Required to place images anywhere */
  top: 0;                   /* Adjust vertical position */
  left: 0;                  /* Adjust horizontal position */
  width: auto;              /* Adjust size individually */
  height: auto;             /* Maintain aspect ratio */
  opacity: 1;               /* Always visible */
  z-index: 2;
  pointer-events: none;     /* Pass clicks through to buttons */
  filter: brightness(1);
  transition: filter 0.05s ease-in-out, opacity 0.05s ease-in-out;
}

/* Quick flash effect */
.flash {
  filter: brightness(3);    /* Adjust brightness for flash */
}

/* =======================================================
   4. MAIN LOGO
   ======================================================= */
.logo {
  position: absolute;
  top: 125px;              /* Adjust vertical position */
  left: 50%;               /* Adjust horizontal position */
  transform: translateX(-50%);
  width: 600px;            /* Adjust size */
  z-index: 5;
}

/* =======================================================
   5. NAVIGATION BUTTONS
   ======================================================= */
.original-button {
  position: absolute;
  display: block;
  z-index: 5;
}

.original-button img {
  display: block;
  height: auto;           /* Adjust button size with width only */
}

/* =======================================================
   6. PURPLE TOGGLE BUTTON
   ======================================================= */
.switch-button {
  position: absolute;
  top: 475px;             /* Adjust vertical position */
  left: 25%;              /* Adjust horizontal position */
  transform: translateX(-50%);
  width: 120px;           /* Adjust size */
  z-index: 1001;
  cursor: pointer;
}

.switch-button img {
  width: 100%;
  height: auto;
  display: block;
}

/* =======================================================
   7. MOBILE RESPONSIVENESS
   ======================================================= */
@media only screen and (max-width: 768px) {
  .logo { width: 400px; top: 100px; }
  .original-button { width: 40%; left: 50%; transform: translateX(-50%); }
  .switch-button { top: 420px; width: 100px; }
}
</style>
</head>

<body>

<div class="container">

  <!-- =======================================================
       MAIN BACKGROUND IMAGE
       ======================================================= -->
  <img id="background" class="background" alt="Background">

  <!-- =======================================================
       FLICKER IMAGES
       Each image labeled for easy resizing and positioning
       ======================================================= -->

  <!-- Flicker 1: Flowers and Bolt -->
  <img id="flicker1" class="flicker-layer" 
       style="width:1275px; top:-165px; left:-100px;" 
       alt="Flowers and Bolt Flicker">

  <!-- Flicker 2: Bolt and Heart -->
  <img id="flicker2" class="flicker-layer" 
       style="width:189px; top:825px; left:500px;" 
       alt="Bolt and Heart Flicker">

  <!-- Flicker 3: Bolt and Star -->
  <img id="flicker3" class="flicker-layer" 
       style="width:675px; top:250px; left:25px;" 
       alt="Bolt and Star Flicker">

  <!-- Flicker 4: Stars -->
  <img id="flicker4" class="flicker-layer" 
       style="width:100px; top:85px; left:575px;" 
       alt="Stars Flicker">

  <!-- Flicker 5: Star and Alien -->
  <img id="flicker5" class="flicker-layer" 
       style="width:650px; top:825px; left:10px;" 
       alt="Star and Alien Flicker">

  <!-- Flicker 6: Flowers -->
  <img id="flicker6" class="flicker-layer" 
       style="width:575px; top:7px; left:480px;" 
       alt="Flowers Flicker">

  <!-- =======================================================
       MAIN LOGO
       ======================================================= -->
  <img src="images/Logoandbeelight.png" alt="Honey Space Logo" class="logo">

  <!-- =======================================================
       NAVIGATION BUTTONS
       ======================================================= -->
  <a href="about.html" class="original-button" style="top:345px; left:25%;">
    <img src="images/Aboutlinkclick.png" style="width:85px;" alt="About Button">
  </a>

  <a href="music.html" class="original-button" style="top:317px; left:35%;">
    <img src="images/Musiclinkclick.png" style="width:133px;" alt="Music Button">
  </a>

  <a href="blog.html" class="original-button" style="top:354px; left:57%;">
    <img src="images/bloglinkclick.png" style="width:81px;" alt="Blog Button">
  </a>

  <a href="gallery.html" class="original-button" style="top:363px; left:46%;">
    <img src="images/Gallerylinkclick.png" style="width:90px;" alt="Gallery Button">
  </a>

  <a href="contact.html" class="original-button" style="top:348px; left:67%;">
    <img src="images/contactlinkclick.png" style="width:80px;" alt="Contact Button">
  </a>

  <!-- PURPLE TOGGLE BUTTON -->
  <a href="#" class="switch-button">
    <img src="images/purplebutton.png" alt="Toggle Overlay">
  </a>

</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const timestamp = new Date().getTime();

  // =======================================================
  // Auto-refresh background
  // =======================================================
  document.getElementById('background').src = 'images/BlackUnearthBackground.png?t=' + timestamp;

  // =======================================================
  // Map all flicker images with cache-busting
  // =======================================================
  const flickerMap = {
    'flicker1': 'images/Flowersandboltflicker.png',
    'flicker2': 'images/Boltandheartflicker.png',
    'flicker3': 'images/Boltandstarflicker.png',
    'flicker4': 'images/Starsflicker.png',
    'flicker5': 'images/starandalienflicker.png',
    'flicker6': 'images/flowersflicker.png'
  };

  Object.keys(flickerMap).forEach(id => {
    const img = document.getElementById(id);
    if(img) img.src = flickerMap[id] + '?t=' + timestamp;
  });

  // =======================================================
  // Function: fast flash flicker images independently
  // =======================================================
  function flashFlicker(img) {
    function doFlash() {
      const flashCount = Math.floor(Math.random()*3)+1; // 1–3 flashes
      let flashes = 0;

      function singleFlash() {
        img.classList.add('flash');
        setTimeout(() => {
          img.classList.remove('flash');
          flashes++;
          if(flashes < flashCount) {
            setTimeout(singleFlash, 80 + Math.random()*80); // very fast flash
          } else {
            // Next flash randomly 10–15s
            const nextTime = 10000 + Math.random()*5000;
            setTimeout(doFlash, nextTime);
          }
        }, 80);
      }

      singleFlash();
    }

    doFlash();
  }

  // Initialize all flicker images
  Object.keys(flickerMap).forEach(id => {
    const img = document.getElementById(id);
    if(img) flashFlicker(img);
  });
});
</script>

</body>
</html>
