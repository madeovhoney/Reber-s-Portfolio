<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Space</title>

<style>

/* =======================================================
   1. GLOBAL PAGE STYLING
   ======================================================= */

body {
  margin: 0;
  padding: 0;
  background: black;
  overflow-x: hidden;
}

.container {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
  background: black;
}

/* =======================================================
   2. BACKGROUND LAYER
   ======================================================= */

.background {
  display: block;
  width: 100%;
  height: auto;
}

/* =======================================================
   3. FLICKER EFFECT LAYER
   ======================================================= */

.flicker {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  animation: flickerAnimation 7s infinite;
  z-index: 1;
}

@keyframes flickerAnimation {
  0%, 15%, 20%, 25%, 50%, 55%, 100% { opacity: 1; }
  16%, 18%, 22%, 24%, 51%, 54% { opacity: 0.3; }
}

/* =======================================================
   4. MAIN LOGO
   ======================================================= */

.logo {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  z-index: 5;
}

/* =======================================================
   5. NAVIGATION BUTTONS (CLICK VERSION SET)
   ======================================================= */

.original-button {
  position: absolute;
  display: block;
  z-index: 5;
}

.original-button img {
  display: block;
  height: auto;
}

/* =======================================================
   6. PURPLE TOGGLE BUTTON (IMAGE-BASED)
   ======================================================= */

.switch-button {
  position: absolute;
  top: 475px;
  left: 25%;
  transform: translateX(-50%);
  width: 120px;
  z-index: 1001;
  cursor: pointer;
}

.switch-button img {
  width: 100%;
  height: auto;
  display: block;
}

/* =======================================================
   7. OVERLAY MODE
   ======================================================= */

#overlay {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 900;
  opacity: 0;
  transition: opacity 0.8s ease-in;
}

#overlay.show {
  display: block;
  opacity: 1;
}

/* Overlay Background */
#overlay .overlay-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
}

/* Overlay Logo */
#overlay .logo-white {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  z-index: 2;
}

/* Overlay White Navigation Buttons */
#overlay .white-button {
  position: absolute;
  display: block;
  z-index: 3;
}

#overlay .white-button img {
  display: block;
  height: auto;
}

/* =======================================================
   8. MOBILE RESPONSIVENESS
   ======================================================= */

@media only screen and (max-width: 768px) {

  .logo,
  #overlay .logo-white {
    width: 400px;
    top: 100px;
  }

  .original-button {
    width: 40%;
    left: 50%;
    transform: translateX(-50%);
  }

  .switch-button {
    top: 420px;
    width: 100px;
  }
}

</style>
</head>

<body>

<div class="container">

  <!-- =====================================================
       BACKGROUND IMAGE (BASE LAYER)
       ===================================================== -->
  <img src="images/BlackUnearthBackground.png" 
       alt="Background" 
       class="background">

  <!-- =====================================================
       FLICKER OVERLAY LAYER
       (You can swap this image to any flicker variation)
       ===================================================== -->
  <img src="images/Flowersandboltflicker.png" 
       alt="Flicker Layer" 
       class="flicker">

  <!-- =====================================================
       MAIN LOGO
       ===================================================== -->
  <img src="images/Logoandbeelight.png" 
       alt="Honey Space Logo" 
       class="logo">

  <!-- =====================================================
       MAIN NAVIGATION BUTTONS (CLICK STYLE)
       ===================================================== -->

  <a href="about.html" class="original-button" style="top: 345px; left: 25%;">
    <img src="images/Aboutlinkclick.png" style="width: 85px;">
  </a>

  <a href="music.html" class="original-button" style="top: 317px; left: 35%;">
    <img src="images/Musiclinkclick.png" style="width: 133px;">
  </a>

  <a href="blog.html" class="original-button" style="top: 354px; left: 57%;">
    <img src="images/bloglinkclick.png" style="width: 81px;">
  </a>

  <a href="gallery.html" class="original-button" style="top: 363px; left: 46%;">
    <img src="images/Gallerylinkclick.png" style="width: 90px;">
  </a>

  <a href="contact.html" class="original-button" style="top: 348px; left: 67%;">
    <img src="images/contactlinkclick.png" style="width: 80px;">
  </a>

  <!-- =====================================================
       PURPLE TOGGLE BUTTON
       ===================================================== -->

  <a href="#" class="switch-button" onclick="toggleOverlay(); return false;">
    <img src="images/purplebutton.png" alt="Toggle Overlay">
  </a>

  <!-- =====================================================
       OVERLAY MODE CONTENT
       ===================================================== -->

  <div id="overlay">

    <!-- Overlay Background -->
    <img src="images/BlackUnearthBackground.png" 
         alt="Overlay Background" 
         class="overlay-bg">

    <!-- Overlay Logo -->
    <img src="images/Logoandbeelight.png" 
         alt="Honey Space Logo" 
         class="logo-white">

    <!-- White Navigation Buttons -->

    <a href="about.html" class="white-button" style="top: 358px; left: 25%;">
      <img src="images/whiteaboutbutton.png" style="width: 79px;">
    </a>

    <a href="music.html" class="white-button" style="top: 363px; left: 35%;">
      <img src="images/whitemusicbutton.png" style="width: 90px;">
    </a>

    <a href="blog.html" class="white-button" style="top: 360px; left: 57%;">
      <img src="images/whiteblogbutton.png" style="width: 69px;">
    </a>

    <a href="gallery.html" class="white-button" style="top: 363px; left: 46%;">
      <img src="images/whitegallerybutton.png" style="width: 90px;">
    </a>

    <a href="contact.html" class="white-button" style="top: 365px; left: 67%;">
      <img src="images/whitecontactbutton.png" style="width: 80px;">
    </a>

  </div>

</div>

<!-- =====================================================
     JAVASCRIPT — OVERLAY TOGGLE FUNCTION
     ===================================================== -->

<script>
function toggleOverlay() {
  const overlay = document.getElementById('overlay');
  overlay.classList.toggle('show');
}
</script>

</body>
</html>
