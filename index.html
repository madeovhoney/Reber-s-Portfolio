<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Honey Space</title>

<style>

/* =====================================================
   GLOBAL PAGE SETTINGS
   ===================================================== */

body {
  margin: 0;
  background: black;
  overflow-x: hidden;
}

.container {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: auto;
}

/* =====================================================
   1. UNEARTHED BACKGROUND
   ===================================================== */

#unearthedBG {
  width: 100%;              /* EDIT SIZE */
  display: block;
  z-index: 1;
}

/* =====================================================
   2. EART HED FADE-IN BACKGROUND
   ===================================================== */

#earthedFade {
  position: absolute;
  top: 0;                   /* EDIT POSITION */
  left: 0;                  /* EDIT POSITION */
  width: 100%;              /* EDIT SIZE */
  opacity: 0;
  transition: opacity 1.2s ease;
  z-index: 2;               /* ABOVE background */
}

.container.overlay-active #earthedFade {
  opacity: 1;
}

/* =====================================================
   3. FLICKER IMAGES (UNEART HED ONLY)
   ===================================================== */

.flicker {
  position: absolute;
  z-index: 3;
  pointer-events: none;
  transition: opacity .4s ease;
}

.container.overlay-active .flicker {
  opacity: 0 !important;
}

/* Bright flash */
.flash {
  filter: brightness(3);
}

/* ---- EDIT EACH FLICKER POSITION + SIZE ---- */

#flowersBolt { width:1275px; top:-150px; left:-89px; }
#boltHeart   { width:189px;  top:825px;  left:500px; }
#boltStar    { width:675px;  top:250px;  left:25px; }
#stars       { width:100px;  top:85px;   left:575px; }
#alienStar   { width:650px;  top:825px;  left:10px; }
#flowers     { width:575px;  top:7px;    left:480px; }

/* =====================================================
   4. NORMAL LOGO (UNEART HED MODE)
   ===================================================== */

#normalLogo {
  position: absolute;
  top: 125px;              /* EDIT */
  left: 50%;               /* EDIT */
  transform: translateX(-50%);
  width: 600px;            /* EDIT */
  z-index: 6;
}

.container.overlay-active #normalLogo {
  display: none;
}

/* =====================================================
   5. OVERLAY LOGO (EART HED MODE ONLY)
   ===================================================== */

#overlayLogo {
  position: absolute;
  top: 125px;              /* EDIT INDEPENDENTLY */
  left: 50%;               /* EDIT INDEPENDENTLY */
  transform: translateX(-50%);
  width: 600px;            /* EDIT INDEPENDENTLY */
  z-index: 7;              /* ABOVE fade */
  display: none;
}

.container.overlay-active #overlayLogo {
  display: block;
}

/* =====================================================
   6. OVERLAY BEE & SNAIL (VISIBLE ONLY IN OVERLAY)
   ===================================================== */

#overlayBeeSnail {
  position: absolute;

  top: 400px;              /* EDIT POSITION */
  left: 40%;               /* EDIT POSITION */
  width: 300px;            /* EDIT SIZE */

  z-index: 7;              /* ABOVE fade image */
  display: none;
}

.container.overlay-active #overlayBeeSnail {
  display: block;
}

/* =====================================================
   7. NORMAL NAV LINKS (UNEART HED)
   ===================================================== */

.normal-link {
  position: absolute;
  z-index: 6;
}

.container.overlay-active .normal-link {
  display: none;
}

/* ---- EDIT EACH NORMAL LINK ---- */

#aboutLink   { top:345px; left:25%; width:85px; }
#musicLink   { top:350px; left:57%; width:86px; }
#blogLink    { top:360px; left:46%; width:81px; }
#galleryLink { top:369px; left:35%; width:90px; }
#contactLink { top:360px; left:67%; width:80px; }

/* =====================================================
   8. OVERLAY NAV LINKS (VISIBLE ONLY IN OVERLAY MODE)
   ===================================================== */

.overlay-link {
  position: absolute;
  z-index: 7;
  display: none;
}

.container.overlay-active .overlay-link {
  display: block;
}

/* ---- EDIT EACH OVERLAY LINK INDEPENDENTLY ---- */

#overlayAbout   { top:345px; left:25%; width:85px; }
#overlayMusic   { top:350px; left:57%; width:86px; }
#overlayBlog    { top:360px; left:46%; width:81px; }
#overlayGallery { top:369px; left:35%; width:90px; }
#overlayContact { top:360px; left:67%; width:80px; }

/* =====================================================
   9. PURPLE TOGGLE BUTTON
   ===================================================== */

#purpleButton {
  position: absolute;
  top: 500px;              /* EDIT POSITION */
  left: 50%;               /* EDIT POSITION */
  transform: translateX(-50%);
  width: 75px;             /* EDIT SIZE */
  z-index: 10;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="container" id="mainContainer">

  <!-- UNEARTHED BACKGROUND -->
  <img src="BlackUnearthBackground.png?v=1" id="unearthedBG">

  <!-- EART HED FADE BACKGROUND -->
  <img src="Earthedoverlayfadein.png?v=1" id="earthedFade">

  <!-- FLICKERS -->
  <img src="Flowersandboltflicker.png?v=1" class="flicker" id="flowersBolt">
  <img src="Boltandheartflicker.png?v=1"   class="flicker" id="boltHeart">
  <img src="Boltandstarflicker.png?v=1"    class="flicker" id="boltStar">
  <img src="Starsflicker.png?v=1"          class="flicker" id="stars">
  <img src="starandalienflicker.png?v=1"   class="flicker" id="alienStar">
  <img src="flowersflicker.png?v=1"        class="flicker" id="flowers">

  <!-- LOGOS -->
  <img src="Logoandbeelight.png?v=1" id="normalLogo">
  <img src="Overlaylogo.png?v=1" id="overlayLogo">

  <!-- OVERLAY BEE & SNAIL -->
  <img src="Overlaybeeandsnail.png?v=1" id="overlayBeeSnail">

  <!-- NORMAL LINKS -->
  <a href="#"><img src="Aboutlinkclick.png?v=1"   id="aboutLink"   class="normal-link"></a>
  <a href="#"><img src="Musiclinkclick.png?v=1"   id="musicLink"   class="normal-link"></a>
  <a href="#"><img src="bloglinkclick.png?v=1"    id="blogLink"    class="normal-link"></a>
  <a href="#"><img src="Gallerylinkclick.png?v=1" id="galleryLink" class="normal-link"></a>
  <a href="#"><img src="contactlinkclick.png?v=1" id="contactLink" class="normal-link"></a>

  <!-- OVERLAY LINKS -->
  <a href="#"><img src="Overlayaboutlink.png?v=1"   id="overlayAbout"   class="overlay-link"></a>
  <a href="#"><img src="Overlaymusiclink.png?v=1"   id="overlayMusic"   class="overlay-link"></a>
  <a href="#"><img src="Overlaybloglink.png?v=1"    id="overlayBlog"    class="overlay-link"></a>
  <a href="#"><img src="Overlaygallerylink.png?v=1" id="overlayGallery" class="overlay-link"></a>
  <a href="#"><img src="Overlaycontactlink.png?v=1" id="overlayContact" class="overlay-link"></a>

  <!-- PURPLE BUTTON -->
  <img src="purplebutton.png?v=1" id="purpleButton">

</div>

<script>

/* =====================================================
   FLICKER SYSTEM
   ===================================================== */

function flickerEffect(img) {
  function cycle() {
    const flashes = Math.floor(Math.random()*3)+1;
    let count = 0;

    function flash() {
      img.classList.add("flash");
      setTimeout(() => {
        img.classList.remove("flash");
        count++;
        if(count < flashes){
          setTimeout(flash, 70 + Math.random()*80);
        } else {
          setTimeout(cycle, 10000 + Math.random()*5000);
        }
      }, 70);
    }

    flash();
  }

  setTimeout(cycle, Math.random()*8000);
}

document.querySelectorAll(".flicker").forEach(flickerEffect);

/* =====================================================
   OVERLAY TOGGLE
   ===================================================== */

document.getElementById("purpleButton")
  .addEventListener("click", function() {
    document.getElementById("mainContainer")
      .classList.toggle("overlay-active");
  });

</script>

</body>
</html>
