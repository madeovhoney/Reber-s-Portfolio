<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Space</title>

<style>
/* =======================================================
   1. GLOBAL PAGE STYLING
   ======================================================= */
body {
  margin: 0;
  padding: 0;
  background: black;
  overflow-x: hidden;
}

.container {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
  background: black;
}

/* =======================================================
   2. BACKGROUND IMAGE
   ======================================================= */
.background {
  display: block;
  width: 100%;
  height: auto;
  z-index: 1;
}

/* =======================================================
   3. MAIN LOGO
   ======================================================= */
.logo {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  z-index: 5;
}

/* =======================================================
   4. NAVIGATION BUTTONS (CLICK STYLE)
   ======================================================= */
.original-button {
  position: absolute;
  display: block;
  z-index: 5;
}

.original-button img {
  display: block;
  height: auto;
}

/* =======================================================
   5. PURPLE TOGGLE BUTTON (IMAGE-BASED)
   ======================================================= */
.switch-button {
  position: absolute;
  top: 475px;
  left: 25%;
  transform: translateX(-50%);
  width: 120px;
  z-index: 1001;
  cursor: pointer;
}

.switch-button img {
  width: 100%;
  height: auto;
  display: block;
}

/* =======================================================
   6. MOBILE RESPONSIVENESS
   ======================================================= */
@media only screen and (max-width: 768px) {

  .logo {
    width: 400px;
    top: 100px;
  }

  .original-button {
    width: 40%;
    left: 50%;
    transform: translateX(-50%);
  }

  .switch-button {
    top: 420px;
    width: 100px;
  }
}

</style>
</head>

<body>

<div class="container">

  <!-- =====================================================
       MAIN BACKGROUND (No overlay, no flicker)
       ===================================================== -->
  <img src="images/BlackUnearthBackground.png" 
       alt="Background" 
       class="background">

  <!-- =====================================================
       MAIN LOGO
       ===================================================== -->
  <img src="images/Logoandbeelight.png" 
       alt="Honey Space Logo" 
       class="logo">

  <!-- =====================================================
       NAVIGATION BUTTONS (CLICK VERSION)
       ===================================================== -->

  <a href="about.html" class="original-button" style="top: 345px; left: 25%;">
    <img src="images/Aboutlinkclick.png" style="width: 85px;">
  </a>

  <a href="music.html" class="original-button" style="top: 317px; left: 35%;">
    <img src="images/Musiclinkclick.png" style="width: 133px;">
  </a>

  <a href="blog.html" class="original-button" style="top: 354px; left: 57%;">
    <img src="images/bloglinkclick.png" style="width: 81px;">
  </a>

  <a href="gallery.html" class="original-button" style="top: 363px; left: 46%;">
    <img src="images/Gallerylinkclick.png" style="width: 90px;">
  </a>

  <a href="contact.html" class="original-button" style="top: 348px; left: 67%;">
    <img src="images/contactlinkclick.png" style="width: 80px;">
  </a>

  <!-- =====================================================
       PURPLE TOGGLE BUTTON (IMAGE-BASED)
       ===================================================== -->
  <a href="#" class="switch-button">
    <img src="images/purplebutton.png" alt="Toggle Overlay">
  </a>

</div>

</body>
</html>
