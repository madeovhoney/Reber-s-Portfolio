<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Honey Space</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      background: black;
    }

    .background, .flicker, .logo, .button {
      display: block;
      width: 100%;
      height: auto;
    }

    .flicker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      transform: translateX(-34px) translateY(69px);
      animation: flickerAnimation 7s infinite;
    }

    @keyframes flickerAnimation {
      0%, 15%, 20%, 25%, 50%, 55%, 100% { opacity: 1; }
      16%, 18%, 22%, 24%, 51%, 54% { opacity: 0.3; }
    }

    .logo {
      position: absolute;
      top: 125px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
    }

    .button {
      position: absolute;
      width: 69px;
      left: 25%;
      transform: translateX(0);
      top: 325px;
    }

    /* Purple On/Off switch button */
    .switch-button {
      position: absolute;
      top: 450px;  /* adjust vertical position */
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 50px;
      background-color: purple;
      border: 2px solid #fff;
      border-radius: 25px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      font-family: sans-serif;
      text-align: center;
      line-height: 50px;
      text-decoration: none;
      transition: background 0.3s, transform 0.2s;
    }

    .switch-button:hover {
      background-color: #a64ca6;
      transform: scale(1.05);
    }

    a {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Stationary background flowers -->
    <img src="images/backgnoflickerflow.png" alt="Background Flowers" class="background">
    
    <!-- Flickering flowers -->
    <img src="images/flickerbacklights.png" alt="Flickering Flowers" class="flicker">

    <!-- Logo -->
    <img src="images/honeyspacelogo.png" alt="Honey Space Logo" class="logo">

    <!-- About button -->
    <a href="about.html">
      <img src="images/abouthoney.png" alt="About Honey" class="button">
    </a>

    <!-- Purple On/Off switch -->
    <a href="newpage.html" class="switch-button">ON / OFF</a>
  </div>
</body>
</html>
