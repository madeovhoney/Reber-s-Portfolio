<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Honey Space</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      background: black;
    }

    .background {
      width: 100%;
      height: auto;
      display: block;
    }

    .logo {
      position: absolute;
      top: 125px; /* adjust as needed */
      left: 50%;
      transform: translateX(-50%);
      width: 600px; /* displays half of the 1,212 px source */
    }

    .button {
      position: absolute;
      width: 50px;
      left: 30%;
      transform: translateX(0);
    }

    .about-button {
      top: 350px;
    }

    a {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="images/backgroundwflowers.png" alt="Background" class="background">
    <img src="images/honeyspacelogo.png" alt="Honey Space Logo" class="logo">

    <a href="about.html">
      <img src="images/abouthoney.png" alt="About Honey" class="button about-button">
    </a>
  </div>
</body>
</html>
