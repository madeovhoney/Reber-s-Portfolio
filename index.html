<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Space</title>

<style>
/* ===============================
   GLOBAL STYLING
   =============================== */
body {
  margin: 0;
  padding: 0;
  background: black;
  overflow-x: hidden;
}
.container {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
}

/* ===============================
   BACKGROUNDS
   =============================== */
#unearthedBG {
  width: 100%;
  display: block;
  z-index: 1;
}

#earthedFade {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  opacity: 0;
  transition: opacity 1.2s ease;
  z-index: 2;
}

.container.overlay-active #earthedFade {
  opacity: 1;
}

/* ===============================
   FLICKER IMAGES (UNEART HED ONLY)
   =============================== */
.flicker {
  position: absolute;
  pointer-events: none;
  z-index: 3;
  transition: opacity 0.4s ease;
}

.container.overlay-active .flicker {
  opacity: 0 !important;
}

.flash {
  filter: brightness(3);
}

/* ---- INDIVIDUAL FLICKER POSITIONS & SIZES ---- */
#flowersBolt { width:1275px; top:-150px; left:-89px; }
#boltHeart   { width:189px;  top:825px;  left:500px; }
#boltStar    { width:675px;  top:250px;  left:25px; }
#stars       { width:100px;  top:85px;  left:575px; }
#alienStar   { width:650px;  top:825px; left:10px; }
#flowers     { width:575px;  top:7px;   left:480px; }

/* ===============================
   LOGOS
   =============================== */
#normalLogo {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  z-index: 6;
}

.container.overlay-active #normalLogo {
  display: none;
}

#overlayLogo {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  z-index: 7;
  display: none;
}

.container.overlay-active #overlayLogo {
  display: block;
}

/* ===============================
   OVERLAY BEE & SNAIL
   =============================== */
#overlayBeeSnail {
  position: absolute;
  top: 400px;
  left: 40%;
  width: 300px;
  z-index: 7;
  display: none;
}

.container.overlay-active #overlayBeeSnail {
  display: block;
}

/* ===============================
   NORMAL NAV LINKS
   =============================== */
.normal-link {
  position: absolute;
  z-index: 6;
}

.container.overlay-active .normal-link {
  display: none;
}

#aboutLink   { top:345px; left:25%; width:85px; }
#musicLink   { top:350px; left:57%; width:86px; }
#blogLink    { top:360px; left:46%; width:81px; }
#galleryLink { top:369px; left:35%; width:90px; }
#contactLink { top:360px; left:67%; width:80px; }

/* ===============================
   OVERLAY NAV LINKS
   =============================== */
.overlay-link {
  position: absolute;
  z-index: 7;
  display: none;
}

.container.overlay-active .overlay-link {
  display: block;
}

#overlayAbout   { top:365px; left:25%; width:85px; }
#overlayMusic   { top:364px; left:57%; width:86px; }
#overlayBlog    { top:369px; left:46%; width:78px; }
#overlayGallery { top:369px; left:35%; width:90px; }
#overlayContact { top:369px; left:67%; width:80px; }

/* ===============================
   PURPLE TOGGLE BUTTON
   =============================== */
#purpleButton {
  position: absolute;
  top: 500px;
  left: 50%;
  transform: translateX(-50%);
  width: 75px;
  z-index: 10;
  cursor: pointer;
}

/* ===============================
   RESPONSIVE
   =============================== */
@media only screen and (max-width:768px) {
  #normalLogo, #overlayLogo { width:400px; top:100px; }
  .normal-link, .overlay-link { width:40%; left:50%; transform:translateX(-50%); }
  #purpleButton { top:420px; width:100px; }
}
</style>
</head>

<body>
<div class="container" id="mainContainer">

  <!-- BACKGROUNDS -->
  <img id="unearthedBG" src="Images/BlackUnearthBackground.png?v=1" alt="Unearthed Background">
  <img id="earthedFade" src="Images/Earthedoverlayfadein.png?v=1" alt="Earthed Fade">

  <!-- FLICKER IMAGES -->
  <img src="Images/Flowersandboltflicker.png?v=1" id="flowersBolt" class="flicker" alt="Flowers & Bolt Flicker">
  <img src="Images/Boltandheartflicker.png?v=1"   id="boltHeart" class="flicker" alt="Bolt & Heart Flicker">
  <img src="Images/Boltandstarflicker.png?v=1"    id="boltStar" class="flicker" alt="Bolt & Star Flicker">
  <img src="Images/Starsflicker.png?v=1"          id="stars" class="flicker" alt="Stars Flicker">
  <img src="Images/starandalienflicker.png?v=1"   id="alienStar" class="flicker" alt="Star & Alien Flicker">
  <img src="Images/flowersflicker.png?v=1"        id="flowers" class="flicker" alt="Flowers Flicker">

  <!-- LOGOS -->
  <img src="Images/Logoandbeelight.png?v=1" id="normalLogo" alt="Normal Logo">
  <img src="Images/Overlaylogo.png?v=1" id="overlayLogo" alt="Overlay Logo">

  <!-- OVERLAY BEE & SNAIL -->
  <img src="Images/Overlaybeeandsnail.png?v=1" id="overlayBeeSnail" alt="Overlay Bee & Snail">

  <!-- NORMAL LINKS -->
  <a href="#"><img src="Images/Aboutlinkclick.png?v=1" id="aboutLink" class="normal-link" alt="About Link"></a>
  <a href="#"><img src="Images/Musiclinkclick.png?v=1" id="musicLink" class="normal-link" alt="Music Link"></a>
  <a href="#"><img src="Images/bloglinkclick.png?v=1" id="blogLink" class="normal-link" alt="Blog Link"></a>
  <a href="#"><img src="Images/Gallerylinkclick.png?v=1" id="galleryLink" class="normal-link" alt="Gallery Link"></a>
  <a href="#"><img src="Images/contactlinkclick.png?v=1" id="contactLink" class="normal-link" alt="Contact Link"></a>

  <!-- OVERLAY LINKS -->
  <a href="#"><img src="Images/Overlayaboutlink.png?v=1" id="overlayAbout" class="overlay-link" alt="Overlay About"></a>
  <a href="#"><img src="Images/Overlaymusiclink.png?v=1" id="overlayMusic" class="overlay-link" alt="Overlay Music"></a>
  <a href="#"><img src="Images/Overlaybloglink.png?v=1" id="overlayBlog" class="overlay-link" alt="Overlay Blog"></a>
  <a href="#"><img src="Images/Overlaygallerylink.png?v=1" id="overlayGallery" class="overlay-link" alt="Overlay Gallery"></a>
  <a href="#"><img src="Images/Overlaycontactlink.png?v=1" id="overlayContact" class="overlay-link" alt="Overlay Contact"></a>

  <!-- PURPLE BUTTON -->
  <img src="Images/purplebutton.png?v=1" id="purpleButton" alt="Purple Toggle Button">

</div>

<script>
// ===============================
// FLICKER FUNCTION
// ===============================
function flickerEffect(img){
  function cycle(){
    const flashes = Math.floor(Math.random()*3)+1;
    let count=0;
    function flash(){
      img.classList.add("flash");
      setTimeout(()=>{
        img.classList.remove("flash");
        count++;
        if(count<flashes){
          setTimeout(flash,70 + Math.random()*80);
        }else{
          setTimeout(cycle,10000 + Math.random()*5000);
        }
      },70);
    }
    flash();
  }
  setTimeout(cycle, Math.random()*8000);
}

// Apply flicker only on unearthed images
document.querySelectorAll(".flicker").forEach(flickerEffect);

// ===============================
// PURPLE BUTTON TOGGLE
// ===============================
document.getElementById("purpleButton").addEventListener("click", function(){
  const container = document.getElementById("mainContainer");
  container.classList.toggle("overlay-active");

  // Force-refresh overlay images
  const timestamp = new Date().getTime();
  document.getElementById("overlayLogo").src = "Images/Overlaylogo.png?v="+timestamp;
  document.getElementById("earthedFade").src = "Images/Earthedoverlayfadein.png?v="+timestamp;
  document.getElementById("overlayBeeSnail").src = "Images/Overlaybeeandsnail.png?v="+timestamp;
  document.querySelectorAll(".overlay-link").forEach(img=>{
    const originalSrc = img.src.split("?v=")[0];
    img.src = originalSrc + "?v=" + timestamp;
  });
});
</script>
</body>
</html>
