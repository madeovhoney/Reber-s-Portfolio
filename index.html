<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Honey Space</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      background: black;
    }

    .background, .flicker, .logo, .button {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Flicker animation */
    .flicker {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  animation: flickerAnimation 1.5s infinite;
  transform: translateX(-32px) translateY(-14px)
    }
    @keyframes flickerAnimation {
      0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
      19%, 21%, 23%, 26%, 54%, 56% { opacity: 0.3; }
    }

    .logo {
      position: absolute;
      top: 125px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
    }

    .button {
      position: absolute;
      width: 69px;
      left: 25%;
      transform: translateX(0);
      top: 325px;
    }

    a {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Stationary background flowers -->
    <img src="images/backgnoflickerflow.png" alt="Background Flowers" class="background">
    
    <!-- Flickering flowers -->
    <img src="images/flickerbacklights.png" alt="Flickering Flowers" class="flicker">

    <!-- Logo -->
    <img src="images/honeyspacelogo.png" alt="Honey Space Logo" class="logo">

    <!-- About button -->
    <a href="about.html">
      <img src="images/abouthoney.png" alt="About Honey" class="button">
    </a>
  </div>
</body>
</html>
