<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Space</title>

<style>
/* ===============================
   GLOBAL STYLING
   =============================== */
body {
  margin: 0;
  padding: 0;
  background: black;
  overflow-x: hidden;
}
.container {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
}

/* ===============================
   BACKGROUNDS
   =============================== */
#unearthedBG {
  width: 100%;
  display: block;
  z-index: 1;
}
#earthedFade {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  opacity: 0;
  transition: opacity 1.2s ease;
  z-index: 2;
}
.container.overlay-active #earthedFade {
  opacity: 1;
}

/* ===============================
   FLICKER IMAGES
   =============================== */
.flicker {
  position: absolute;
  pointer-events: none;
  z-index: 3;
  transition: opacity 0.4s ease;
}
.container.overlay-active .flicker {
  opacity: 0 !important;
}
.flash {
  filter: brightness(3);
}
/* Flicker positions & sizes */
#flowersBolt { width:1275px; top:-150px; left:-89px; }
#boltHeart   { width:189px;  top:825px;  left:500px; }
#boltStar    { width:675px;  top:250px;  left:25px; }
#stars       { width:100px;  top:85px;  left:575px; }
#alienStar   { width:650px;  top:825px; left:10px; }
#flowers     { width:575px;  top:7px;  left:480px; }

/* ===============================
   LOGOS
   =============================== */
#normalLogo {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  z-index: 6;
}
.container.overlay-active #normalLogo {
  display: none;
}
#overlayLogo {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  z-index: 7;
  display: none;
}
.container.overlay-active #overlayLogo {
  display: block;
}

/* ===============================
   OVERLAY BEE & SNAIL
   =============================== */
#overlayBeeSnail {
  position: absolute;
  top: 200px;
  left: 50%;
  width: 800px;
  z-index: 7;
  display: none;
  animation: snailBeeCircle 12s linear infinite;
  transform-origin: 50% 50%;
}
.container.overlay-active #overlayBeeSnail {
  display: block;
}
@keyframes snailBeeCircle {
  0%   { transform: translate(-50%, -50%) rotate(0deg) translateX(100px) rotate(0deg); }
  25%  { transform: translate(-50%, -50%) rotate(90deg) translateX(100px) rotate(-90deg); }
  50%  { transform: translate(-50%, -50%) rotate(180deg) translateX(100px) rotate(-180deg); }
  75%  { transform: translate(-50%, -50%) rotate(270deg) translateX(100px) rotate(-270deg); }
  100% { transform: translate(-50%, -50%) rotate(360deg) translateX(100px) rotate(-360deg); }
}

/* ===============================
   NAV LINKS
   =============================== */
.normal-link {
  position: absolute;
  z-index: 6;
}
.container.overlay-active .normal-link {
  display: none;
}
.overlay-link {
  position: absolute;
  z-index: 7;
  display: none;
}
.container.overlay-active .overlay-link {
  display: block;
}

/* ===============================
   PURPLE BUTTON
   =============================== */
#purpleButton {
  position: absolute;
  top: 500px;
  left: 35%;
  transform: translateX(-50%);
  width: 50px;
  z-index: 10;
  cursor: pointer;
}

/* ===============================
   RESPONSIVE
   =============================== */
@media only screen and (max-width:768px) {
  #normalLogo, #overlayLogo { width:400px; top:100px; }
  .normal-link, .overlay-link { width:40%; left:50%; transform:translateX(-50%); }
  #purpleButton { top:420px; width:100px; }
}
</style>
</head>

<body>
<div class="container" id="mainContainer">

  <!-- BACKGROUNDS -->
  <img id="unearthedBG" src="Images/BlackUnearthBackground.png?v=1">
  <img id="earthedFade" src="Images/Earthedoverlayfadein.png?v=1">

  <!-- LOGOS -->
  <img src="Images/Logoandbeelight.png?v=1" id="normalLogo">
  <img src="Images/Overlaylogo.png?v=1" id="overlayLogo">

  <!-- OVERLAY -->
  <img src="Images/Overlaybeeandsnail.png?v=1" id="overlayBeeSnail">

  <!-- BUTTON -->
  <img src="Images/purplebutton.png?v=1" id="purpleButton">

</div>

<script>
/* ===============================
   CLEAN URL (NEW FIX)
   =============================== */
if (window.location.search) {
  window.history.replaceState({}, document.title, window.location.pathname);
}

/* ===============================
   PURPLE BUTTON TOGGLE
   =============================== */
document.getElementById("purpleButton").addEventListener("click", function(){
  const container = document.getElementById("mainContainer");
  container.classList.toggle("overlay-active");

  const timestamp = new Date().getTime();
  document.getElementById("overlayLogo").src = "Images/Overlaylogo.png?v="+timestamp;
  document.getElementById("earthedFade").src = "Images/Earthedoverlayfadein.png?v="+timestamp;
  document.getElementById("overlayBeeSnail").src = "Images/Overlaybeeandsnail.png?v="+timestamp;
});
</script>

</body>
</html>
