<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Honey Space</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      background: black;
    }

    .background, .flicker, .logo, .button {
      display: block;
      width: 100%;
      height: auto;
    }

    .flicker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      transform: translateX(-34px) translateY(69px);
      animation: flickerAnimation 7s infinite;
    }

    @keyframes flickerAnimation {
      0%, 15%, 20%, 25%, 50%, 55%, 100% { opacity: 1; }
      16%, 18%, 22%, 24%, 51%, 54% { opacity: 0.3; }
    }

    .logo {
      position: absolute;
      top: 125px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
    }

    /* Buttons styling */
    .button-link {
      position: absolute;
      width: 200px; /* adjust size for each button as needed */
      left: 50%;
      transform: translateX(-50%);
    }

    .about-button { top: 325px; width: 150px; }
    .music-button { top: 400px; width: 150px; }
    .blog-button { top: 475px; width: 150px; }
    .gallery-button { top: 550px; width: 150px; }
    .contact-button { top: 625px; width: 150px; }

    /* Purple On/Off switch button */
    .switch-button {
      position: absolute;
      top: 700px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 50px;
      background-color: purple;
      border: 2px solid #fff;
      border-radius: 25px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      font-family: sans-serif;
      text-align: center;
      line-height: 50px;
      text-decoration: none;
      transition: background 0.3s, transform 0.2s;
    }

    .switch-button:hover {
      background-color: #a64ca6;
      transform: scale(1.05);
    }

    a {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Stationary background flowers -->
    <img src="images/backgnoflickerflow.png" alt="Background Flowers" class="background">
    
    <!-- Flickering flowers -->
    <img src="images/flickerbacklights.png" alt="Flickering Flowers" class="flicker">

    <!-- Logo -->
    <img src="images/honeyspacelogo.png" alt="Honey Space Logo" class="logo">

    <!-- Buttons / clickable links -->
    <a href="about.html" class="button-link about-button">
      <img src="images/abouthoney.png" alt="About Honey">
    </a>

    <a href="music.html" class="button-link music-button">
      <img src="images/musicbutton.png" alt="Music">
    </a>

    <a href="blog.html" class="button-link blog-button">
      <img src="images/blogbutton.png" alt="Blog">
    </a>

    <a href="gallery.html" class="button-link gallery-button">
      <img src="images/gallerybutton.png" alt="Gallery">
    </a>

    <a href="contact.html" class="button-link contact-button">
      <img src="images/contactbutton.png" alt="Contact">
    </a>

    <!-- Purple On/Off switch -->
    <a href="newpage.html" class="switch-button">ON / OFF</a>
  </div>
</body>
</html>
