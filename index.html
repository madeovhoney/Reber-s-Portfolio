<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Space Flicker Animation</title>

<style>
/* =======================================================
   1. GLOBAL STYLING
   ======================================================= */
body {
  margin: 0;
  padding: 0;
  background: black;
  overflow-x: hidden;
}

.container {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
  background: black;
}

/* =======================================================
   2. MAIN BACKGROUND IMAGE
   ======================================================= */
.background {
  display: block;
  width: 100%;
  height: auto;
  z-index: 1;
}

/* =======================================================
   3. FLICKER IMAGES
   ======================================================= */
.flicker-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: auto;
  height: auto;
  opacity: 1;
  z-index: 2;
  pointer-events: none;
  animation-name: flickerAnimation;
  animation-duration: 5s;
  animation-iteration-count: infinite;
  animation-timing-function: ease-in-out;
}

@keyframes flickerAnimation {
  0%, 20%, 40%, 60%, 80%, 100% { opacity: 1; }
  10%, 30%, 50%, 70%, 90% { opacity: 0.3; }
}

/* =======================================================
   4. MAIN LOGO
   ======================================================= */
.logo {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  z-index: 5;
}

/* =======================================================
   5. NAVIGATION BUTTONS
   ======================================================= */
.original-button {
  position: absolute;
  display: block;
  z-index: 5;
}

.original-button img {
  display: block;
  height: auto;
}

/* =======================================================
   6. PURPLE TOGGLE BUTTON
   ======================================================= */
.switch-button {
  position: absolute;
  top: 475px;
  left: 25%;
  transform: translateX(-50%);
  width: 120px;
  z-index: 1001;
  cursor: pointer;
}

.switch-button img {
  width: 100%;
  height: auto;
  display: block;
}

/* =======================================================
   7. MOBILE RESPONSIVENESS
   ======================================================= */
@media only screen and (max-width: 768px) {
  .logo { width: 400px; top: 100px; }
  .original-button { width: 40%; left: 50%; transform: translateX(-50%); }
  .switch-button { top: 420px; width: 100px; }
}
</style>
</head>

<body>

<div class="container">

  <!-- MAIN BACKGROUND -->
  <img src="images/BlackUnearthBackground.png" alt="Background" class="background">

  <!-- FLICKER IMAGES -->
  <img id="flicker1" class="flicker-layer" style="width:1200px; top:-125px; left:-25px; animation-delay:0s;">
  <img id="flicker2" class="flicker-layer" style="width:300px; top:800px; left:350px; animation-delay:1.5s;">
  <img id="flicker3" class="flicker-layer" style="width:675px; top:250px; left:25px; animation-delay:3s;">
  <img id="flicker4" class="flicker-layer" style="width:100px; top:85px; left:575px; animation-delay:4.5s;">
  <img id="flicker5" class="flicker-layer" style="width:750px; top:800px; left:50px; animation-delay:6s;">
  <img id="flicker6" class="flicker-layer" style="width:575px; top:7px; left:480px; animation-delay:7.5s;">

  <!-- MAIN LOGO -->
  <img src="images/Logoandbeelight.png" alt="Honey Space Logo" class="logo">

  <!-- NAVIGATION BUTTONS -->
  <a href="about.html" class="original-button" style="top:345px; left:25%;">
    <img src="images/Aboutlinkclick.png" style="width:85px;">
  </a>
  <a href="music.html" class="original-button" style="top:317px; left:35%;">
    <img src="images/Musiclinkclick.png" style="width:133px;">
  </a>
  <a href="blog.html" class="original-button" style="top:354px; left:57%;">
    <img src="images/bloglinkclick.png" style="width:81px;">
  </a>
  <a href="gallery.html" class="original-button" style="top:363px; left:46%;">
    <img src="images/Gallerylinkclick.png" style="width:90px;">
  </a>
  <a href="contact.html" class="original-button" style="top:348px; left:67%;">
    <img src="images/contactlinkclick.png" style="width:80px;">
  </a>

  <!-- PURPLE TOGGLE BUTTON -->
  <a href="#" class="switch-button">
    <img src="images/purplebutton.png" alt="Toggle Overlay">
  </a>

</div>

<!-- =======================================================
     JAVASCRIPT: AUTOMATIC FLICKER IMAGE REFRESH
     ======================================================= -->
<script>
  function initFlickers() {
    const timestamp = new Date().getTime();

    // Map flicker IDs to their image files
    const flickerMap = {
      'flicker1': 'images/Flowersandboltflicker.png',
      'flicker2': 'images/Boltandheartflicker.png',
      'flicker3': 'images/Boltandstarflicker.png',
      'flicker4': 'images/Starsflicker.png',
      'flicker5': 'images/starandalienflicker.png',
      'flicker6': 'images/flowersflicker.png'
    };

    Object.keys(flickerMap).forEach(id => {
      const img = document.getElementById(id);
      if(img) {
        // Set src with timestamp, replacing any old src
        img.src = flickerMap[id] + '?t=' + timestamp;
      }
    });
  }

  // Run on page load
  window.addEventListener('load', initFlickers);
</script>

</body>
</html>
